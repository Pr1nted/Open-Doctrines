# A Render Blueprint for an always-on OpenDoctrines server on the FREE plan.
#
# Render -> New -> Blueprint, pointed at this repository and this file
# (deploy/server/render.yaml). Values marked sync: false are secrets: Render asks
# for them when the blueprint is applied, and they never enter the repository.
#
# What the free plan means here, measured (tests/render_sim_test.sh):
#   memory   512 MB; the server peaks well under that on Modern Day.
#   CPU      a tenth of one; a turn takes longer, which a day-long turn ignores.
#   disk     wiped on every restart -- OD_CAMPAIGN_REPO is where the campaign
#            lives, restored on start and pushed after every turn.
#   restarts Render "might restart a Free web service at any time"; every start
#            restores the campaign, so a restart costs about a minute.
#   sleep    after 15 minutes with no INBOUND request. Players arrive through the
#            relay, which is outbound, so something must ping /healthz: the
#            account service does, every 10 minutes, for each URL in its
#            KEEPALIVE_URLS (net/wrangler.toml).
services:
  - type: web
    name: od-tournament
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./deploy/server/Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    # Deploy by hand, when a release is tagged -- never on every commit.
    autoDeployTrigger: "off"
    # On a redeploy the old instance gets SIGTERM about a minute after the new
    # one is healthy, then this long to exit. It saves the world, pushes it to
    # the campaign repository and releases the lock in that time; the default
    # 30 s is too tight for a push over the network.
    maxShutdownDelaySeconds: 180
    envVars:
      # https://x-access-token:<fine-grained token>@github.com/Pr1nted/od-campaign.git
      - key: OD_CAMPAIGN_REPO
        sync: false
      - key: OD_SERVER_NAME
        value: OpenDoctrines tournament
      - key: OD_MAP
        value: map                 # Modern Day
      - key: OD_TURN_SECONDS
        value: "86400"             # a turn a day
      - key: OD_START_AT_PLAYERS
        value: "0"                 # a lobby until the host types `start`
      - key: OD_MAX_PLAYERS
        value: "16"
      - key: OD_RELAY
        value: "1"                 # players join with the code alone
      - key: OD_LLM_ENDPOINT
        value: https://api.groq.com/openai/v1
      - key: OD_LLM_MODEL
        value: openai/gpt-oss-20b
      # Each has its own daily allowance on Groq's free tier (200k tokens); when
      # one is spent the next answers. Three triples the letters a day.
      - key: OD_LLM_FALLBACK_MODELS
        value: openai/gpt-oss-120b,qwen/qwen3.8-27b
      - key: OD_LLM_KEY            # the Groq API key
        sync: false
