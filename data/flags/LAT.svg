<!-- Latin has no country, so it has no flag. This is a vexillum: the legions'
     standard, gold on crimson, which is the device a reader is likeliest to
     read as "Latin" without being told. Authored here, not taken from
     anywhere. The letters are outlines lifted from the DejaVu Sans this game
     already ships, so there is no font to find at draw time and nanosvg can
     draw it as well as rsvg can. -->
