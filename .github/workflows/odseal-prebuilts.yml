# Rebuild the sealed odseal archives, one per platform we ship on.
#
# WHY THIS WORKFLOW EXISTS
#
# odseal ships as a binary, not as source (docs/odseal.md). That buys the thing
# it is meant to buy, and it costs this: a closed component and a clone that
# builds are only compatible if a prebuilt exists for EVERY target. Producing
# five archives by hand, on five machines, is exactly the chore that silently
# stops happening -- and the way it fails is a red CI on a platform nobody built
# for, long after the change that caused it.
#
# So the archives are built here, from one source, with one set of flags, and
# committed back. Nobody has to own a Windows machine to ship a Windows build.
#
# WHERE THE SOURCE COMES FROM
#
# Not from this repository -- guard/ is gitignored and is not published. It is
# checked out from a private repository named by the ODSEAL_SOURCE_REPO secret
# using ODSEAL_SOURCE_TOKEN. Without those two the job stops immediately and
# says so, rather than building nothing and committing an empty archive.
#
# THE SOURCE MUST NOT LEAK. It is never printed, never uploaded as an artifact,
# and the checkout is removed before any artifact is packed. Only the stripped
# archives leave this workflow.
#
# EVERY ARCHIVE IS TESTED BEFORE IT IS COMMITTED. A prebuilt that links but
# misbehaves is worse than one that is missing: the first ships a broken
# guarantee, the second fails the configure with an explanation. Where the
# runner can execute the target it runs tests/odseal_test.cpp against the real
# archive. Where it cannot -- Android is cross-compiled -- it checks the
# archive exports the four symbols and nothing else.

name: odseal prebuilts

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch to commit the rebuilt archives to"
        required: false
        default: "main"

# Two of these running at once would race on the same files in the commit job.
concurrency:
  group: odseal-prebuilts
  cancel-in-progress: false

# Only what pushing a branch needs. Opening the request is left to a person --
# the setting that would let this workflow do it also lets a workflow APPROVE
# one, and main requires review.
permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false          # one platform's toolchain breaking should not hide the rest
      matrix:
        include:
          - { name: macos-universal, os: macos-14 }
          - { name: linux-x86_64,    os: ubuntu-22.04 }
          # Arm Linux, and the reason it is here: without this prebuilt a
          # linux-arm64 game build stops at CONFIGURE with "no prebuilt for
          # this platform", because CMake asks for linux-${CMAKE_SYSTEM_PROCESSOR}
          # and there is no linux-aarch64 directory. GitHub hosts Arm runners
          # now, so this one needs no special machine.
          - { name: linux-aarch64,   os: ubuntu-22.04-arm }
          - { name: windows-x86_64,  os: windows-2022,   msvc_arch: x64 }
          # 32-bit and Arm Windows. x86 is built by the x64 runner's own MSVC
          # (amd64_x86) and runs there natively under WoW64; Arm64 gets a native
          # Arm runner. The names are what CMakeLists.txt asks for, from MSVC's
          # CMAKE_CXX_COMPILER_ARCHITECTURE_ID.
          - { name: windows-x86,     os: windows-2022,   msvc_arch: amd64_x86 }
          - { name: windows-arm64,   os: windows-11-arm, msvc_arch: arm64 }
          # 32-bit x86, 32-bit Arm (armhf) and RISC-V Linux, CROSS-compiled on an
          # x86-64 runner with Ubuntu's own cross gcc and tested under QEMU user
          # mode. The directory names are what a native `uname -m` says (i686,
          # armv7l, riscv64), which is also what CMakeLists.txt normalises a
          # 32-bit build on a 64-bit kernel to.
          - { name: linux-i686,      os: ubuntu-22.04, triplet: i686-linux-gnu,      qemu: i386 }
          - { name: linux-armv7l,    os: ubuntu-22.04, triplet: arm-linux-gnueabihf, qemu: arm }
          - { name: linux-riscv64,   os: ubuntu-22.04, triplet: riscv64-linux-gnu,   qemu: riscv64 }
          - { name: web-wasm32,      os: ubuntu-22.04 }
          - { name: android-arm64-v8a, os: ubuntu-22.04 }
          # THE BSDs RUN INSIDE A VM ON A LINUX RUNNER, because GitHub hosts
          # no BSD runner and is not going to. vmactions boots a real FreeBSD
          # or OpenBSD, shares the workspace into it, and runs the build
          # there -- so these are genuinely built by the target system's own
          # cc and ar, not cross-compiled by a Linux toolchain pretending.
          #
          # amd64, not x86_64: that is what `uname -m` says on both BSDs, and
          # CMAKE_SYSTEM_PROCESSOR follows it. The directory name has to match
          # what CMakeLists.txt asks for or the archive is invisible -- which
          # is the whole class of bug that kept linux-aarch64 from shipping.
          - { name: freebsd-amd64,   os: ubuntu-22.04 }
          - { name: openbsd-amd64,   os: ubuntu-22.04 }

    steps:
      - uses: actions/checkout@v5

      # Fail here, loudly, rather than later with an empty archive. A missing
      # secret is a configuration mistake and it should read like one.
      - name: Check the source secrets are configured
        shell: bash
        env:
          REPO: ${{ secrets.ODSEAL_SOURCE_REPO }}
          TOKEN: ${{ secrets.ODSEAL_SOURCE_TOKEN }}
        run: |
          set -e
          test -n "$REPO"  || { echo "ODSEAL_SOURCE_REPO is not set -- see docs/odseal.md"; exit 1; }
          test -n "$TOKEN" || { echo "ODSEAL_SOURCE_TOKEN is not set -- see docs/odseal.md"; exit 1; }

      # The private source, into guard/. persist-credentials is off so the token
      # is not left in a .git/config that a later step could read or print.
      - name: Fetch the sealed source
        uses: actions/checkout@v5
        with:
          repository: ${{ secrets.ODSEAL_SOURCE_REPO }}
          token: ${{ secrets.ODSEAL_SOURCE_TOKEN }}
          path: guard
          persist-credentials: false

      - name: Confirm the source arrived
        shell: bash
        run: |
          set -e
          test -f guard/odseal.cpp || { echo "guard/odseal.cpp missing from the private repo"; exit 1; }
          test -f guard/odseal.h   || { echo "guard/odseal.h missing from the private repo";   exit 1; }
          echo "source present"      # deliberately says nothing about its contents

      # ── the five toolchains ──

      - name: Build (macOS universal)
        if: matrix.name == 'macos-universal'
        shell: bash
        run: |
          set -e
          mkdir -p out
          for A in arm64 x86_64; do
            c++ -std=c++17 -O3 -fvisibility=hidden -fno-rtti -fomit-frame-pointer \
                -arch $A -mmacosx-version-min=11.0 -c guard/odseal.cpp -o "odseal-$A.o"
            strip -x "odseal-$A.o"
          done
          lipo -create odseal-arm64.o odseal-x86_64.o -output odseal.o
          ar rcs out/libodseal.a odseal.o
          lipo -archs out/libodseal.a

      # The same recipe as x86_64, deliberately character for character apart
      # from the runner: two archives of one source built with different flags
      # would differ in ways nothing here would catch. The first version of
      # this step invented its own flags and its own source path (src/ rather
      # than guard/) and failed with "No such file or directory".
      - name: Build (Linux aarch64)
        if: matrix.name == 'linux-aarch64'
        shell: bash
        run: |
          set -e
          mkdir -p out
          g++ -std=c++17 -O3 -fvisibility=hidden -fno-rtti -fomit-frame-pointer -fPIC \
              -c guard/odseal.cpp -o odseal.o
          strip --strip-unneeded odseal.o
          ar rcs out/libodseal.a odseal.o

      - name: Build (Linux x86_64)
        if: matrix.name == 'linux-x86_64'
        shell: bash
        run: |
          set -e
          mkdir -p out
          g++ -std=c++17 -O3 -fvisibility=hidden -fno-rtti -fomit-frame-pointer -fPIC \
              -c guard/odseal.cpp -o odseal.o
          strip --strip-unneeded odseal.o
          ar rcs out/libodseal.a odseal.o

      # Linux cross targets: Ubuntu's cross gcc for the triplet, and QEMU user
      # mode to run the test. Same flags as the native Linux builds, character
      # for character, with the triplet's own strip and ar -- the host's would
      # either refuse a foreign object or, worse, quietly mangle it.
      - name: Install the cross toolchain
        if: matrix.triplet
        shell: bash
        run: |
          set -e
          sudo apt-get update -qq
          sudo apt-get install -y -qq g++-${{ matrix.triplet }} qemu-user-static

      - name: Build (Linux cross)
        if: matrix.triplet
        shell: bash
        run: |
          set -e
          mkdir -p out
          T=${{ matrix.triplet }}
          $T-g++ -std=c++17 -O3 -fvisibility=hidden -fno-rtti -fomit-frame-pointer -fPIC \
              -c guard/odseal.cpp -o odseal.o
          $T-strip --strip-unneeded odseal.o
          $T-ar rcs out/libodseal.a odseal.o
          file odseal.o

      # The target architecture is the msvc_arch the matrix names: amd64, the
      # x64 runner targeting x86 (amd64_x86), or the Arm runner's own arm64.
      - name: MSVC environment
        if: startsWith(matrix.name, 'windows-')
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.msvc_arch }}

      # MSVC hides symbols unless they are exported, so there is no visibility
      # flag to pass; /GR- is the no-RTTI equivalent. The artifact is a .lib.
      - name: Build (Windows)
        if: startsWith(matrix.name, 'windows-')
        shell: cmd
        run: |
          mkdir out
          cl /nologo /std:c++17 /O2 /GR- /EHsc /c guard\odseal.cpp /Foodseal.obj || exit /b 1
          lib /nologo /OUT:out\odseal.lib odseal.obj || exit /b 1

      - uses: mymindstorm/setup-emsdk@v14
        if: matrix.name == 'web-wasm32'

      - name: Build (web wasm32)
        if: matrix.name == 'web-wasm32'
        shell: bash
        run: |
          set -e
          mkdir -p out
          em++ -std=c++17 -O3 -fvisibility=hidden -fno-rtti -c guard/odseal.cpp -o odseal.o
          emar rcs out/libodseal.a odseal.o

      # Same NDK discovery as the android job in test.yml: name it explicitly so
      # a runner image bump cannot change the compiler under us.
      - name: Locate the NDK
        if: matrix.name == 'android-arm64-v8a'
        shell: bash
        run: |
          set -e
          NDK="$(ls -d "$ANDROID_SDK_ROOT"/ndk/* | sort -V | tail -1)"
          test -n "$NDK" || { echo "no NDK on this runner"; exit 1; }
          echo "ANDROID_NDK_HOME=$NDK" >> "$GITHUB_ENV"
          echo "using $NDK"

      - name: Build (android arm64-v8a)
        if: matrix.name == 'android-arm64-v8a'
        shell: bash
        run: |
          set -e
          mkdir -p out
          TC="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          "$TC/aarch64-linux-android24-clang++" \
              -std=c++17 -O3 -fvisibility=hidden -fno-rtti -fomit-frame-pointer -fPIC \
              -c guard/odseal.cpp -o odseal.o
          "$TC/llvm-strip" --strip-unneeded odseal.o
          "$TC/llvm-ar" rcs out/libodseal.a odseal.o

      # ── the source goes no further ──
      #
      # Removed before the archive is packed, so there is no path by which a
      # later step or a stray artifact upload could carry it out of the runner.
      # One step builds AND tests, because crossing the VM boundary twice to
      # do them separately buys nothing: the archive never leaves the VM in
      # between, and a test that ran anywhere else would not be testing the
      # thing this job produces.
      - name: Build and test (FreeBSD amd64)
        if: matrix.name == 'freebsd-amd64'
        uses: vmactions/freebsd-vm@v1
        with:
          release: '14.2'
          usesh: true
          copyback: true
          run: |
            set -e
            mkdir -p out
            c++ -std=c++17 -O3 -fvisibility=hidden -fno-rtti -fomit-frame-pointer -fPIC \
                -c guard/odseal.cpp -o odseal.o
            strip --strip-unneeded odseal.o
            ar rcs out/libodseal.a odseal.o
            # Native, so the real test runs rather than a symbol check.
            c++ -std=c++17 -O1 -I third_party/odseal tests/odseal_test.cpp out/libodseal.a -o odseal_test
            ./odseal_test
            rm -rf guard odseal_test

      - name: Build and test (OpenBSD amd64)
        if: matrix.name == 'openbsd-amd64'
        uses: vmactions/openbsd-vm@v1
        with:
          release: '7.6'
          usesh: true
          copyback: true
          run: |
            set -e
            mkdir -p out
            # OpenBSD's base clang. NOT `strip -x`: that discards every local
            # symbol, and OpenBSD's strip refuses rather than corrupt the
            # object --
            #
            #   strip: error: 'odseal.o': not stripping symbol '.L.str.1'
            #   because it is named in a relocation
            #
            # which is correct of it and was the first thing this job did.
            # --strip-unneeded is the flag that means what was intended:
            # remove what relocation processing does not need, keep what it
            # does. It is also exactly what the FreeBSD and Linux steps use.
            c++ -std=c++17 -O3 -fvisibility=hidden -fno-rtti -fomit-frame-pointer -fPIC \
                -c guard/odseal.cpp -o odseal.o
            strip --strip-unneeded odseal.o
            ar rcs out/libodseal.a odseal.o

            # The exports, asserted rather than assumed. Whatever strip did or
            # declined to do, what leaves this VM must be the entry points and
            # nothing else -- a stray symbol is what points a reader at what
            # this library does. Same two rules as the android check.
            # Plain `nm -g`, and its errors are NOT hidden. --defined-only is
            # a GNU long option OpenBSD's nm does not take; with stderr sent
            # to /dev/null the check simply saw an empty list and reported
            # "missing entry point: od_fz" about an archive that was fine.
            # Filtering on T already excludes undefined symbols, which is all
            # --defined-only was doing.
            GOT="$(nm -g out/libodseal.a | awk '$2=="T"{print $3}' | sort | tr '\n' ' ')"
            echo "exports: $GOT"
            for sym in od_fz od_k9 od_s7 od_v3; do
              printf '%s\n' $GOT | grep -qx "$sym" || { echo "missing entry point: $sym"; exit 1; }
            done
            for sym in $GOT; do
              case " od_fz od_k9 od_s7 od_t4 od_v3 " in
                *" $sym "*) ;;
                *) echo "unexpected export: $sym"; exit 1 ;;
              esac
            done

            c++ -std=c++17 -O1 -I third_party/odseal tests/odseal_test.cpp out/libodseal.a -o odseal_test
            ./odseal_test
            rm -rf guard odseal_test

      - name: Drop the sealed source
        if: always()
        shell: bash
        run: rm -rf guard

      # ── prove the archive before trusting it ──

      - name: Test the archive (native)
        if: matrix.name == 'macos-universal' || matrix.name == 'linux-x86_64'
        shell: bash
        run: |
          set -e
          c++ -std=c++17 -O1 -I third_party/odseal tests/odseal_test.cpp out/libodseal.a -o odseal_test
          ./odseal_test

      # Every Windows archive runs here: x64 and x86 natively on the x64 runner
      # (x86 under WoW64), Arm64 natively on the Arm runner.
      - name: Test the archive (Windows)
        if: startsWith(matrix.name, 'windows-')
        shell: cmd
        run: |
          cl /nologo /std:c++17 /O2 /EHsc /I third_party\odseal tests\odseal_test.cpp out\odseal.lib /Feodseal_test.exe || exit /b 1
          odseal_test.exe || exit /b 1

      # The real test, not a symbol check: QEMU user mode runs the foreign
      # binary. Linked -static so it needs no foreign loader or libc on the
      # runner -- what runs is the archive and the test, nothing borrowed.
      - name: Test the archive (Linux cross, under QEMU)
        if: matrix.triplet
        shell: bash
        run: |
          set -e
          T=${{ matrix.triplet }}
          $T-g++ -std=c++17 -O1 -static -I third_party/odseal tests/odseal_test.cpp \
              out/libodseal.a -o odseal_test
          qemu-${{ matrix.qemu }}-static ./odseal_test

      # wasm cannot run natively, but node runs what emscripten emits, so this
      # is the same test rather than a weaker stand-in.
      - name: Test the archive (web, under node)
        if: matrix.name == 'web-wasm32'
        shell: bash
        run: |
          set -e
          em++ -std=c++17 -O1 -I third_party/odseal tests/odseal_test.cpp out/libodseal.a -o odseal_test.js
          node odseal_test.js

      # Android is cross-compiled and there is no device here, so the contract
      # cannot be executed. What CAN be checked is the shape of the archive:
      # the four entry points, and nothing else exported to point a reader at
      # what it does.
      - name: Check the archive (android, symbols only)
        if: matrix.name == 'android-arm64-v8a'
        shell: bash
        run: |
          set -e
          TC="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          GOT="$("$TC/llvm-nm" --defined-only --extern-only out/libodseal.a | awk '$2=="T"{print $3}' | sort | tr '\n' ' ')"
          echo "exports: $GOT"
          # An EXACT list here meant the check failed the moment the sealed
          # source grew an entry point -- the archive was correct and the
          # assertion was stale, which is the failure that reads as "the build
          # is broken" and is not. Two rules instead, and they are the two the
          # check is actually for: every entry point the game links must be
          # present, and nothing may be exported that is not a known one,
          # because a stray symbol is what points a reader at what this does.
          REQUIRED="od_fz od_k9 od_s7 od_v3"
          ALLOWED="od_fz od_k9 od_s7 od_t4 od_v3"
          for s in $REQUIRED; do
            printf '%s\n' $GOT | grep -qx "$s" || { echo "missing entry point: $s"; exit 1; }
          done
          for s in $GOT; do
            case " $ALLOWED " in
              *" $s "*) ;;
              *) echo "unexpected export: $s"; exit 1 ;;
            esac
          done

      - uses: actions/upload-artifact@v4
        with:
          name: odseal-${{ matrix.name }}
          path: out/*
          if-no-files-found: error
          retention-days: 1

  commit:
    name: commit the archives
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}

      - uses: actions/download-artifact@v4
        with:
          path: incoming

      # One directory per platform, named exactly as CMakeLists.txt looks for
      # it. A mismatch here is a configure error on someone else's machine, so
      # the names are spelled out rather than derived.
      - name: Place the archives
        shell: bash
        run: |
          set -e
          # -m 644 because `install` defaults to 755 and these are archives,
          # not programs. Without it every rebuild committed a mode change on
          # all five files whether or not a byte moved, and shipped the
          # libraries executable.
          # WHATEVER ARRIVED, not a list of what was expected to. This was five
          # install lines naming five platforms, so the matrix above and this
          # step were two lists that had to agree -- and when linux-aarch64 was
          # added to one and not the other, the job BUILT the archive, uploaded
          # it, downloaded it, and placed nothing. Every build was green and the
          # new platform simply never appeared in the commit.
          #
          # A loop means adding a platform is one change, in the matrix, which
          # is where a reader looks for the list of platforms.
          placed=0
          for d in incoming/odseal-*/; do
              [ -d "$d" ] || continue
              name=$(basename "$d"); name=${name#odseal-}
              for f in "$d"/*; do
                  [ -f "$f" ] || continue
                  # 644 because install defaults to 755 and these are archives,
                  # not programs.
                  install -D -m 644 "$f" "third_party/odseal/$name/$(basename "$f")"
                  placed=$((placed + 1))
              done
          done
          # A run that places nothing has failed, whatever the builds said.
          [ "$placed" -gt 0 ] || { echo "no archives arrived in incoming/"; ls -R incoming; exit 1; }
          echo "placed $placed archive(s)"
          rm -rf incoming
          find third_party/odseal -type f | sort

      # ── A BRANCH AND A PULL REQUEST, NOT A PUSH ──
      #
      # This job used to push straight to the target branch and could not: main
      # requires reviews and fourteen status checks, so the push was declined
      # with GH006 and five successful builds were thrown away at the last step.
      # A workflow whose entire purpose is to commit archives could not commit
      # them, and the way that surfaced was a red run that said nothing about
      # protection.
      #
      # A pull request goes through the same gate everything else does, which
      # is the point of the gate. The archives are binaries built from a source
      # nobody reviewing can read, so what a reviewer is actually confirming is
      # that a rebuild was intended -- and that is worth one click.
      - name: Push the archives to a branch if anything changed
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -e
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add third_party/odseal
          # Nothing to do is a normal outcome: the source did not change.
          if git diff --cached --quiet; then
            echo "archives are unchanged"
            exit 0
          fi

          # WHAT CHANGED, IN THE ONLY TERMS THAT MEAN ANYTHING HERE. A diff of
          # a stripped archive is unreadable, and two of these embed a build
          # timestamp in the ar header -- so a rebuild from identical source
          # shows as "changed" on macOS and web while linux and android come
          # out byte-identical. The exported symbols are the part a reviewer
          # can actually check, so they go in the body.
          {
            echo "Rebuilt from the sealed source. Exports per archive:"
            echo
            for f in $(find third_party/odseal -name 'libodseal.a' -o -name 'odseal.lib' | sort); do
              echo "- \`$f\`: $(nm --defined-only --extern-only "$f" 2>/dev/null \
                    | awk '$2=="T"{print $3}' | sed 's/^_//' | sort -u | tr '\n' ' ')"
            done
            echo
            echo "Note: macOS and web archives embed a build timestamp, so they"
            echo "differ on every rebuild even when the source has not changed."
          } > /tmp/pr-body.md

          BRANCH="odseal-prebuilts/$(date -u +%Y%m%d-%H%M%S)"
          git checkout -b "$BRANCH"
          git commit -m "Rebuild the odseal prebuilts"
          git push origin "$BRANCH"

          # THE BRANCH, AND A LINK. Not `gh pr create`: opening a request from
          # a workflow needs "Allow GitHub Actions to create and approve pull
          # requests", and that one setting grants BOTH -- on a repository
          # whose main branch requires review, letting a workflow approve is
          # the gate approving itself. Pushing a branch needs no such
          # permission and leaves the one judgement worth keeping with a
          # person: whether this rebuild was wanted.
          URL="${{ github.server_url }}/${{ github.repository }}/compare/${{ inputs.ref }}...$BRANCH?expand=1"
          {
            echo "### Archives rebuilt on \`$BRANCH\`"
            echo
            echo "[Open a pull request]($URL)"
            echo
            cat /tmp/pr-body.md
          } >> "$GITHUB_STEP_SUMMARY"
          echo "branch pushed: $BRANCH"
          echo "open a pull request: $URL"
