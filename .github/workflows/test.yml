# Does it work, on every platform we ship? Nothing here releases anything.
#
# WHY THIS IS A SEPARATE WORKFLOW FROM release-game.yml
#
# The release workflow answers "can this be published", and it only runs on a
# tag. That is the wrong moment to discover a platform is broken: by then the
# version is bumped, the notes are written and the tag is pushed. This answers
# "does main work", on every push, and it is the workflow that should be red or
# green at any given moment.
#
# It is also reusable (`workflow_call`), so release-game.yml runs exactly these
# checks rather than a second copy of them that drifts.
#
# WHAT IT COVERS
#
#   the mod system   archive, runtime, manager and ABI conformance, plus every
#                    SDK example rebuilt from source and compared byte for byte
#                    against the reference implementation
#   hosting+joining  a real NetHost and four real players over loopback: seats,
#                    a country claimed twice and refused, a turn, a disconnect,
#                    a turn resolved WITHOUT that player, and a reconnect that
#                    returns them to their own country
#   actually playing loads a shipped scenario, resolves turns, writes a save --
#                    the check that a build runs at all, which no unit test makes
#
# All of it is tools/qualify.sh, one script, so what CI checks and what you can
# run on your own machine cannot drift apart.

name: Test

on:
  # main only, NOT "**". A branch in this repository that is pushed and then
  # opened as a pull request matched both triggers, and fourteen jobs ran twice
  # for one commit -- two complete runs, two sets of runner minutes, and two
  # rows per context in the checks list. Pull requests are covered by the
  # pull_request trigger below, forks included; what a branches-["**"] push
  # trigger adds on top of that is only the duplicate.
  #
  # The cost is that a branch pushed with no pull request open gets no CI until
  # one is opened. That is the intended path now that main requires a reviewed
  # pull request from anyone but the maintainer.
  push:
    branches: [main]
    tags-ignore: ["**"]        # tags are release-game.yml's job, not this one
  pull_request:
  workflow_dispatch:
  workflow_call:               # release-game.yml calls this before publishing

# One run per ref, newest wins. A newer commit makes an older run moot, and
# this workflow is fourteen jobs.
#
# This was off while the platforms were being brought up, and for a real
# reason: each push killed the jobs that were about to say something, so no
# commit ever produced a complete picture and the same failures had to be
# rediscovered a push later. The condition for turning it back on was all
# platforms green, which e561fae was -- all fourteen.
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    # A hang must not cost six hours. GitHub's default job timeout is 360
    # minutes, and a test that blocks on stdin will happily use all of it: one
    # did, holding a Windows runner for 26 minutes before anyone looked and
    # heading for the full six. The slowest honest run here is Windows at about
    # nine minutes, so 30 is generous and still fails fast.
    timeout-minutes: 30
    strategy:
      fail-fast: false     # one platform failing must not hide the others
      matrix:
        include:
          - { name: macos-arm64,  os: macos-14 }
          # macos-15-intel, NOT macos-13. GitHub retired the macos-13 image, so
          # a job asking for it is never scheduled -- it sits queued forever
          # rather than failing. That is worse than a failure: the run never
          # finishes, it holds the concurrency group, and every later push is
          # cancelled behind it. Six consecutive runs were lost that way before
          # anyone noticed macos-x64 had never once completed.
          - { name: macos-x64,    os: macos-15-intel }
          - { name: windows-x64,  os: windows-2022 }
          - { name: linux-x64,    os: ubuntu-22.04 }

    steps:
      - uses: actions/checkout@v5

      # Pinned, not inherited. The stand-in account service signs with WebCrypto
      # Ed25519, which arrived in node 18 -- and on older node the file does not
      # fail with "unsupported algorithm", it fails to PARSE, reporting a bare
      # `SyntaxError: Unexpected reserved word` pointing at a crypto line.
      # Ubuntu's own package is node 12, so this is reachable on an ordinary
      # machine, and the error tells you nothing about the real cause.
      - uses: actions/setup-node@v5
        with: { node-version: "22" }

      # Pillow decodes the GIFs the encoder writes. An encoder cannot verify its
      # own LZW: a stream with a mis-sized code still has a valid header and
      # still opens.
      #
      # numpy is what the shipped-map checks read pixels with -- the water,
      # naval-layer, integrity, preview and encoding checks all walk a province
      # or land/sea layer as an array. Without it those five report a
      # ModuleNotFoundError, run_all.sh counts five failures, and qualify.sh
      # says the platform is not qualified for a reason that has nothing to do
      # with the platform. Which is exactly what happened: they pass on a
      # developer machine, where numpy is always already there.
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - run: python -m pip install --quiet Pillow numpy

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # raylib's X11/ALSA backend, plus xvfb: the simulation step opens a
          # window, because the game has one renderer and it is not optional.
          # A hosted runner has no display.
          sudo apt-get install -y libasound2-dev libx11-dev libxrandr-dev \
            libxi-dev libgl1-mesa-dev libglu1-mesa-dev libxcursor-dev \
            libxinerama-dev libwayland-dev libxkbcommon-dev xvfb

      # Windows runs this under Git Bash, which GitHub's Windows images already
      # have. The suite is bash (tests/run_all.sh, tests/connectivity_test.sh),
      # so a PowerShell port would be a second implementation to keep in step.
      # Software OpenGL, so that "does it actually run" is not skipped on the
      # one platform where it always was.
      #
      # A hosted Windows runner has no GPU. WGL answers "The driver does not
      # appear to support OpenGL", raylib faults inside InitWindow(), and
      # qualify.sh reports the window step as SKIPPED -- correctly, because a
      # machine that cannot draw is not a broken build. The cost was that
      # Windows proved it COMPILED and never once proved it STARTS, and that is
      # the gap v1.0.3a shipped through: an executable that did not run at all,
      # on the only platform whose run check never ran.
      #
      # Mesa's llvmpipe is a complete OpenGL implementation in software. Copied
      # beside the executable it overrides opengl32.dll for that process alone.
      # Purely a test dependency: nothing here is packaged, installed or shipped.
      #
      # Pinned, not "latest". A test aid that changes under you turns an
      # unrelated push red and costs an afternoon finding out why.
      - name: Software OpenGL (Mesa llvmpipe)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          ver=26.1.4
          curl -sL --fail -o mesa.7z \
            "https://github.com/pal1000/mesa-dist-win/releases/download/$ver/mesa3d-$ver-release-msvc.7z"
          7z x -y -omesa mesa.7z > /dev/null
          # The whole x64 payload, not opengl32.dll alone: current Mesa splits
          # the driver across several DLLs that opengl32.dll loads by name from
          # its own directory, and copying one file gets a loader error instead
          # of a working context.
          gl=$(find mesa -path '*x64*' -name opengl32.dll | head -1)
          if [ -z "$gl" ]; then echo "no x64 opengl32.dll in the archive"; exit 1; fi
          echo "OD_SOFTWARE_GL_DIR=$(dirname "$gl")" >> "$GITHUB_ENV"
          # llvmpipe explicitly. Left to itself Mesa may pick the d3d12 driver
          # and hand back the same absent GPU this exists to work around.
          echo "GALLIUM_DRIVER=llvmpipe" >> "$GITHUB_ENV"

      # NINJA, NOT MSBUILD, and the reason is what -j means.
      #
      # CMake defaults to the Visual Studio generator on Windows, where
      # `cmake --build -j4` becomes MSBuild /m:4 -- four parallel PROJECTS.
      # Every build in qualify.sh names one target, so there was one project to
      # spread across four ways of spreading it, and cl.exe walked its
      # translation units one at a time. That is how a job with the same core
      # count as Linux spent 24 minutes building what Linux built in 10, and
      # why this job was cancelled at its 30 minute cap for weeks.
      #
      # Ninja parallelises at the file, like make does, so -j means the same
      # thing on all four platforms. It also makes the build tree single-config
      # -- build/OpenDoctrines.exe rather than build/Release/OpenDoctrines.exe
      # -- which every script here already probes for, because they were
      # written against both layouts from the start.
      #
      # Ninja needs cl.exe on PATH, which the Visual Studio generator arranges
      # for itself and Ninja cannot. That is all this action does: run
      # vcvarsall and export what it sets. Ninja itself ships on the runner
      # image, and the check below says so plainly rather than letting CMake
      # report a missing generator.
      - name: MSVC environment (for Ninja)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build with Ninja
        if: runner.os == 'Windows'
        shell: bash
        run: |
          command -v ninja >/dev/null || { echo "ninja is not on PATH"; exit 1; }
          ninja --version
          # Read by cmake itself, so qualify.sh needs to know nothing about it.
          echo "CMAKE_GENERATOR=Ninja" >> "$GITHUB_ENV"

      - name: Qualify
        shell: bash
        run: tools/qualify.sh build

      # THE PACKAGED COPY, not the build tree.
      #
      # Everything above runs the game out of build/, with OD_DATA_DIR pointed
      # at a directory of symlinks. That is the one layout no player ever has,
      # and it is the blind spot that "works for the developer, broken for the
      # player" bugs live in: a data folder resolved from the executable, a
      # directory that exists only in a working copy, a file the packagers were
      # never told to ship. Every one of those passes every check above.
      #
      # So this runs what tools/package.py actually ships -- the same tree the
      # zips and the installer are built from -- from a working directory that
      # is not the game's own, with no OD_DATA_DIR. The game has to find its own
      # data the way a player's copy does, and then play a real scenario out of
      # it.
      - name: The packaged copy runs
        shell: bash
        run: |
          set -e
          BIN=build/OpenDoctrines
          [ -d "build/OpenDoctrines.app" ] && BIN=build/OpenDoctrines.app
          # Both Windows layouts: Ninja writes build/, MSBuild writes
          # build/Release/. Checked in that order so whichever one exists wins.
          [ -f "build/OpenDoctrines.exe" ] && BIN=build/OpenDoctrines.exe
          [ -f "build/Release/OpenDoctrines.exe" ] && BIN=build/Release/OpenDoctrines.exe
          python3 tools/package.py --binary "$BIN" --out dist/pkg

          if [ -d dist/pkg/OpenDoctrines.app ]; then
            GAME="$PWD/dist/pkg/OpenDoctrines.app/Contents/MacOS/OpenDoctrines"
            DATA="$PWD/dist/pkg/OpenDoctrines.app/Contents/data"
          elif [ -f dist/pkg/OpenDoctrines.exe ]; then
            GAME="$PWD/dist/pkg/OpenDoctrines.exe"; DATA="$PWD/dist/pkg/data"
          else
            GAME="$PWD/dist/pkg/OpenDoctrines"; DATA="$PWD/dist/pkg/data"
          fi

          # Software GL beside the PACKAGED binary. qualify.sh copied it next to
          # the build-tree one, which is a different directory, so without this
          # the Windows run would report "no display" and skip the very check
          # this step exists to make.
          if [ -n "${OD_SOFTWARE_GL_DIR:-}" ] && [ -d "${OD_SOFTWARE_GL_DIR}" ]; then
            cp "$OD_SOFTWARE_GL_DIR"/*.dll "$(dirname "$GAME")/" 2>/dev/null || true
          fi

          # The empty-array idiom from qualify.sh: macOS ships bash 3.2, where
          # expanding an empty array under set -u is an error.
          runner=()
          if [ -z "${DISPLAY:-}" ] && command -v xvfb-run >/dev/null; then
            runner=(xvfb-run -a)
          fi

          # Somewhere that is NOT the game's folder, so nothing can resolve
          # through the current directory by accident.
          mkdir -p "$RUNNER_TEMP/od-pkg-cwd"
          cd "$RUNNER_TEMP/od-pkg-cwd"

          set +e
          ${runner[@]+"${runner[@]}"} "$GAME" \
              --simulate "$DATA/STDmaps/1939.odmap" 3 PkgCheck > pkg.log 2>&1
          rc=$?
          set -e
          grep -aE '^\[SIM\]|could not find its data folder' pkg.log || true

          # A machine that cannot draw is not a broken package -- same rule, and
          # the same list of ways each platform words it, as qualify.sh.
          if grep -qaE 'suitable pixel format|does not appear to support OpenGL|could not open a window|Failed to initialize GLFW|GLX' pkg.log; then
            echo "::notice title=packaged run skipped::no usable display on this runner"
            exit 0
          fi
          if grep -qa 'could not find its data folder' pkg.log; then
            echo "THE PACKAGED COPY COULD NOT FIND ITS OWN DATA."
            tail -30 pkg.log; exit 1
          fi
          if [ "$rc" -ne 0 ]; then
            echo "The packaged copy exited $rc."; tail -30 pkg.log; exit 1
          fi
          grep -qa '^\[SIM\] turn 3/3' pkg.log || {
            echo "The packaged copy did not play three turns."; tail -30 pkg.log; exit 1; }
          echo "OK: the packaged copy found its own data and played 1939."

  # The web build is a platform too, and the one where "it compiled" is least
  # informative: it is the only target that links against different backends
  # (WsWeb rather than WsNative, PeerLinkWeb rather than PeerLinkNative), so it
  # is the one most likely to have a file that stopped compiling months ago and
  # was never noticed. It cannot run tests_all.sh -- there is no shell in a
  # browser -- so what is checked is that it builds and that the package is
  # assembled.
  android:
    name: android (arm64-v8a)
    runs-on: ubuntu-22.04
    timeout-minutes: 40      # same reason as qualify: a link that hangs is not free
    steps:
      - uses: actions/checkout@v5

      # The runner ships an SDK and an NDK already; name the NDK explicitly so a
      # runner image bump cannot silently change the compiler under us.
      - name: Locate the NDK
        run: |
          set -e
          NDK="$(ls -d "$ANDROID_SDK_ROOT"/ndk/* | sort -V | tail -1)"
          test -n "$NDK" || { echo "no NDK on this runner"; exit 1; }
          echo "ANDROID_NDK_HOME=$NDK" >> "$GITHUB_ENV"
          echo "using $NDK"

      - name: Build the shared library
        run: |
          set -e
          cmake -B build-android \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-24 \
            -DPLATFORM=Android -DCMAKE_BUILD_TYPE=Release \
            -DOD_ENABLE_MODS=OFF -DOD_ENABLE_NET=OFF
          cmake --build build-android -j 2

      # A .so that linked is not the same as one Android can start. Both symbols
      # are reached only by dlsym, so the linker will happily drop them and the
      # library still "builds" -- the app then fails to launch with nothing in
      # the log that names the cause.
      - name: The library is a real NativeActivity
        run: |
          set -e
          SO=build-android/libopendoctrines.so
          test -s "$SO" || { echo "missing: $SO"; exit 1; }
          READELF="$(ls "$ANDROID_NDK_HOME"/toolchains/llvm/prebuilt/*/bin/llvm-readelf | head -1)"
          "$READELF" --dyn-syms "$SO" | grep -q ANativeActivity_onCreate || {
            echo "ANativeActivity_onCreate is not exported -- the app cannot start"; exit 1; }
          "$READELF" --dyn-syms "$SO" | grep -q android_main || {
            echo "android_main is not exported"; exit 1; }
          # raylib must have built its ANDROID backend. If PLATFORM=Android is
          # lost, it compiles the desktop GLFW path instead: everything links,
          # and nothing renders on a phone.
          if "$READELF" --dyn-syms "$SO" | grep -qi glfw; then
            echo "GLFW symbols present -- raylib built the DESKTOP backend"; exit 1
          fi
          for lib in libEGL.so libGLESv2.so libandroid.so liblog.so; do
            "$READELF" -d "$SO" | grep -q "$lib" || { echo "not linked against $lib"; exit 1; }
          done

      - name: Package the APK
        run: ./tools/package_android.sh

      - name: The APK is installable
        run: |
          set -e
          APK=build-android/OpenDoctrines.apk
          test -s "$APK" || { echo "missing: $APK"; exit 1; }
          python3 - "$APK" <<'PYEOF'
          import sys, zipfile
          z = zipfile.ZipFile(sys.argv[1])
          names = set(z.namelist())
          fail = []

          # The three things without which it is not an app at all.
          for need in ("AndroidManifest.xml", "lib/arm64-v8a/libopendoctrines.so"):
              if need not in names: fail.append("missing " + need)
          if not any(n.startswith("res/mipmap-") for n in names):
              fail.append("no launcher icon -- the app shows the generic robot")

          # TARGETING SDK 30+ REQUIRES resources.arsc STORED AND ALIGNED.
          # Learned the hard way: a packaging step that re-zipped the APK
          # compressed it, and the install was refused outright with a parse
          # error that names neither the file nor the step that broke it.
          if "resources.arsc" in names:
              i = z.getinfo("resources.arsc")
              if i.compress_type != zipfile.ZIP_STORED:
                  fail.append("resources.arsc is DEFLATED; install will be rejected")

          # extractNativeLibs defaults false at targetSdk 34, so the loader maps
          # the .so straight out of the APK and it must be uncompressed.
          so = "lib/arm64-v8a/libopendoctrines.so"
          if so in names and z.getinfo(so).compress_type != zipfile.ZIP_STORED:
              fail.append("the .so is DEFLATED; it must be STORED to be mapped")

          # The game copies its content out on first run and needs a list to do
          # it with, because an APK's assets cannot be enumerated.
          if "assets/assets_manifest.txt" not in names:
              fail.append("assets_manifest.txt missing -- nothing can be extracted")
          else:
              listed = [l.strip() for l in z.read("assets/assets_manifest.txt")
                        .decode().splitlines() if l.strip()]
              missing = [p for p in listed if ("assets/" + p) not in names]
              if missing:
                  fail.append(f"{len(missing)} manifest entries are not in the APK, "
                              f"e.g. {missing[:3]}")
              if not listed: fail.append("the manifest is empty")

          # The scenarios and the model are what the game is; shipping without
          # them produces an app that starts and has no game in it.
          if not any(n.startswith("assets/STDmaps/") and n.endswith(".odmap") for n in names):
              fail.append("no .odmap scenarios in the APK")
          if "assets/ai/model.bin" not in names:
              fail.append("no AI model in the APK")

          # NOTHING PRIVATE IN THE ASSETS -- the same rule the web preload has,
          # and the same reason: this blob goes to every player.
          for leak in ("assets/account.json", "assets/config.json", "assets/mods.json"):
              if leak in names: fail.append("PRIVATE DATA: " + leak)
          for n in names:
              if n.startswith(("assets/saves/", "assets/custom_maps/")) or "model.w" in n:
                  fail.append("PRIVATE DATA: " + n); break

          if fail:
              print("\n".join("  " + f for f in fail)); sys.exit(1)
          print(f"  ok: {len(names)} entries, "
                f"{sum(i.file_size for i in z.infolist())/1e6:.0f} MB uncompressed")
          PYEOF

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build-android/OpenDoctrines.apk
          if-no-files-found: error

  web:
    name: web (emscripten)
    runs-on: ubuntu-22.04
    timeout-minutes: 30      # same reason as qualify; a link that hangs is not free
    steps:
      - uses: actions/checkout@v5
      - uses: mymindstorm/setup-emsdk@v14
        with: { version: latest }

      # Without fontTools the unifont subset cannot be built, and the page
      # ships the whole 11 MB font instead of a 147 KB one.
      - run: python3 -m pip install --quiet fonttools

      - name: Build
        run: |
          emcmake cmake -B build-web -DCMAKE_BUILD_TYPE=Release
          emmake cmake --build build-web -j 2

      # A link that "succeeded" without producing a loadable module is a
      # failure that reports success, so name the four files that must exist.
      - name: The package is complete
        run: |
          set -e
          for f in OpenDoctrines.html OpenDoctrines.js OpenDoctrines.wasm OpenDoctrines.data; do
            test -s "build-web/$f" || { echo "missing or empty: $f"; exit 1; }
          done
          # index.html as well, because it is the only entry point a host looks
          # for. itch.io runs the game in an iframe and serves index.html from
          # the root of the upload; without it the page is a 404 and the build
          # is unshippable while looking perfectly fine here.
          test -s build-web/index.html || { echo "missing: index.html"; exit 1; }

          # NOTHING PRIVATE IN THE PRELOAD.
          #
          # OpenDoctrines.data is one blob served to every visitor, and it used
          # to be built from the working copy with a handful of exclusions -- a
          # denylist, which on a developer's machine swept in saves, settings
          # and data/account.json, a signed session token for the account
          # service. It is built from OD_SHIPPED_DATA now. This asserts that,
          # because the failure is invisible: the package works perfectly and
          # simply also contains things it should not.
          # Checked against the .js, not the .data: file_packager writes the
          # bytes into the .data and the PATH MANIFEST into the loader script,
          # so the names only exist here. Grepping the blob would pass whatever
          # was in it.
          for leak in /data/account.json /data/config.json /data/mods.json \
                      /data/saves/ /data/custom_maps/ /data/ai/model.w; do
            if grep -qaF "$leak" build-web/OpenDoctrines.js; then
              echo "PRIVATE DATA IN THE WEB PRELOAD: $leak"; exit 1
            fi
          done
          # Music is streamed rather than preloaded, so it has to have been
          # copied next to the page. A deployment without it is a silent game.
          test -d build-web/data/audio/music || { echo "streamed music was not copied"; exit 1; }
          ls -lh build-web/OpenDoctrines.* build-web/data/audio/music | head -20

  # ── The dedicated server, on its own ────────────────────────────────────
  #
  # The server is already built and smoke-tested inside qualify, but only
  # there: a twenty-minute job that also builds the game, opens a window under
  # xvfb and runs the whole suite. When that job goes red -- as it did for a
  # missing numpy -- it says nothing about whether the server is healthy, and
  # the server is the half of this project somebody is expected to run
  # unattended on a machine they are paying for.
  #
  # release-server.yml builds it too, and only on a tag. By then a break is
  # already in a release.
  #
  # So: its own job, on every push, failing on its own.
  # ------------------------------------------------------------------ GDTL ---
  # The Greater Diplomacy translation layer, which no other job here builds:
  # OD_ENABLE_GDTL is off by default, so every other build compiles it to stubs
  # and would not notice if the real thing stopped compiling at all.
  #
  # The desktop flow was driven by hand on macOS. Nothing had ever run it on
  # Windows, Linux, Android or the web -- and three of those four have their own
  # answer to "where does a file go" and "is there a file chooser at all", which
  # is exactly the kind of difference that is invisible until somebody is
  # holding the platform it is wrong on.
  #
  # Three platforms build the test and RUN it. Android cannot run here, so it
  # is built and its architecture checked. The web runs under node with
  # NODERAWFS, which is the same code a browser executes against MEMFS.
  gdtl:
    name: translation layer (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x64,   os: ubuntu-22.04 }
          - { name: macos-arm64, os: macos-14 }
          - { name: windows-x64, os: windows-2022 }
    steps:
      - uses: actions/checkout@v5

      # zenity, so the file chooser test builds its command through the real
      # zenity branch rather than the "no helper installed" one. The qualify
      # job installs neither, so this is the only place that path is exercised.
      #
      # The test's last step -- asking the installed zenity whether it accepts
      # those flags -- does NOT run here, and the test says so rather than
      # pretending. zenity pulls in xdg-desktop-portal, and on a runner with no
      # desktop it starts GTK and never returns; it hung this job at its thirty
      # minute cap three runs running before the test learned to bound it.
      # Reproduced with Xvfb and a real session bus, and it hangs there too.
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libx11-dev libxrandr-dev \
            libxi-dev libgl1-mesa-dev libglu1-mesa-dev libxcursor-dev \
            libxinerama-dev libwayland-dev libxkbcommon-dev \
            zenity xvfb

      # Same generator as everywhere else on Windows -- see the qualify job.
      - name: MSVC environment (for Ninja)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
      - name: Build with Ninja
        if: runner.os == 'Windows'
        shell: bash
        run: echo "CMAKE_GENERATOR=Ninja" >> "$GITHUB_ENV"

      - name: Build and run
        shell: bash
        run: |
          set -e
          cmake -B build-gdtl -DCMAKE_BUILD_TYPE=Release -DOD_ENABLE_GDTL=ON \
                -DOD_ENABLE_MODS=OFF -DOD_ENABLE_NET=OFF
          cmake --build build-gdtl --config Release --target GdtlTest NativeDialogTest -j 4

          # Both layouts, for the same reason as everywhere else here.
          find_test() {
            for c in "build-gdtl/$1" "build-gdtl/$1.exe" "build-gdtl/Release/$1.exe"; do
              [ -f "$c" ] && { echo "$c"; return 0; }
            done
            echo "no $1 was built" >&2; return 1
          }

          # Under a display on Linux: with one the chooser test asks the real
          # zenity whether it takes these flags, without one it can only check
          # the command it built. Windows needs no display -- the PowerShell
          # probe stops short of showing the window.
          # An if, not `[ ... ] && RUN=...`: this step runs under `set -e`, and
          # a false test as the last command of a line is a non-zero status,
          # which would end the step on the two platforms that are not Linux.
          RUN=""
          if [ "$RUNNER_OS" = "Linux" ]; then RUN="xvfb-run -a"; fi
          $RUN "$(find_test NativeDialogTest)"
          "$(find_test GdtlTest)"

  gdtl-android:
    name: translation layer (android)
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Locate the NDK
        run: |
          set -e
          NDK="$(ls -d "$ANDROID_SDK_ROOT"/ndk/* | sort -V | tail -1)"
          test -n "$NDK" || { echo "no NDK on this runner"; exit 1; }
          echo "ANDROID_NDK_HOME=$NDK" >> "$GITHUB_ENV"
      # Built, not run: this is an aarch64 Android binary on an x86 Linux
      # runner. What it proves is that the layer compiles and LINKS for the
      # platform -- which is where a #ifdef that forgot Android shows up, since
      # __linux__ is defined there too.
      - name: Cross-compile the test
        run: |
          set -e
          cmake -B build-gdtl-android \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-24 \
            -DPLATFORM=Android -DCMAKE_BUILD_TYPE=Release \
            -DOD_ENABLE_MODS=OFF -DOD_ENABLE_NET=OFF -DOD_ENABLE_GDTL=ON
          cmake --build build-gdtl-android --target GdtlTest -j 4
          file build-gdtl-android/GdtlTest
          file build-gdtl-android/GdtlTest | grep -q "ARM aarch64" || {
            echo "that is not an Android binary"; exit 1; }

  gdtl-web:
    name: translation layer (web)
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: mymindstorm/setup-emsdk@v14
      # Run, not merely built. NODERAWFS hands it node's filesystem in place of
      # the MEMFS a browser gives it; the conversion reads and writes ordinary
      # paths either way, so this exercises the same code the download path
      # runs before it hands the browser a blob.
      - name: Build and run under node
        run: |
          set -e
          emcmake cmake -B build-gdtl-web -DCMAKE_BUILD_TYPE=Release -DOD_ENABLE_GDTL=ON \
                        -DOD_ENABLE_MODS=OFF -DOD_ENABLE_NET=OFF
          emmake cmake --build build-gdtl-web --target GdtlTest -j 4
          node build-gdtl-web/GdtlTest.js

  server:
    name: server (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x64,   os: ubuntu-22.04 }
          - { name: macos-arm64, os: macos-14 }
          - { name: windows-x64, os: windows-2022 }
    steps:
      - uses: actions/checkout@v5

      # raylib is configured even for this target -- the server compiles
      # against its HEADERS so the two cannot disagree about a struct -- and
      # raylib's own CMakeLists wants the X11/GL/ALSA development headers on
      # Linux before it will configure. So they are installed to BUILD it. The
      # point of the server is that none of them are needed to RUN it, and that
      # is what the link check below actually asserts.
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libx11-dev libxrandr-dev \
                                  libxi-dev libgl1-mesa-dev libglu1-mesa-dev \
                                  libxcursor-dev libxinerama-dev libwayland-dev \
                                  libxkbcommon-dev

      # Same generator as the qualify job, for the same reason -- see the note
      # on it there. Kept in step deliberately: two Windows jobs building the
      # same code through different generators is a difference that only ever
      # shows up as one of them failing.
      - name: MSVC environment (for Ninja)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build the server only
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then export CMAKE_GENERATOR=Ninja; fi
          cmake -B build-server -DCMAKE_BUILD_TYPE=Release
          cmake --build build-server --config Release --target OpenDoctrinesServer -j 2

      - name: Smoke test
        shell: bash
        run: tests/server_smoke_test.sh build-server

      # THE PROPERTY THE SERVER EXISTS FOR.
      #
      # "Runs on a VPS or in a container" is a claim about what the binary
      # needs at runtime, and it is one line of CMake away from being false --
      # target_link_libraries(OpenDoctrinesServer raylib) would build, pass
      # every test, and quietly require a GPU stack on the host. Nothing else
      # in this repository would notice. This does.
      #
      # Windows is left out rather than faked: dumpbin needs a developer shell,
      # and asserting nothing is worse than asserting it somewhere else.
      - name: The binary needs no graphics stack
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -e
          bin=build-server/OpenDoctrinesServer
          test -x "$bin" || { echo "no server binary at $bin"; exit 1; }
          if [ "$RUNNER_OS" = "Linux" ]; then libs=$(ldd "$bin"); else libs=$(otool -L "$bin"); fi
          echo "$libs"
          for bad in raylib libGL libGLX libEGL libX11 libXrandr libXi libXcursor \
                     libXinerama libwayland libxkbcommon libasound OpenGL.framework; do
            if printf '%s' "$libs" | grep -qi -- "$bad"; then
              echo "FAIL: the dedicated server links $bad -- it is meant to run headless"
              exit 1
            fi
          done
          echo "ok: links nothing graphical"
