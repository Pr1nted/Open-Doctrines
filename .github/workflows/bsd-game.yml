# The game, built on FreeBSD, OpenBSD and NetBSD for amd64 and arm64, and on
# OpenIndiana (illumos) and Haiku for x86-64.
#
# WHY A SEPARATE WORKFLOW
#
# GitHub hosts no BSD runner and is not going to, so these build inside a real
# BSD VM (vmactions) on a Linux runner -- by the target system's own cc, not
# cross-compiled by a Linux toolchain pretending. That is a different shape
# from every other entry in release-game.yml's matrix, which is one job per
# runner, so it lives on its own and is CALLED from there (and from
# release-dryrun.yml).
#
# AND IT RUNS ON ITS OWN, on every pull request and every push to main, the
# same triggers as test.yml: a BSD build that can only be exercised by tagging
# is one that gets discovered broken on a tag, which is the exact failure
# release-dryrun.yml exists to prevent. Not FROM test.yml, because the release
# and dry-run workflows call both, and one run cannot upload the same artifact
# name twice.
#
# ARM IS EMULATED
#
# The arm64 guests run under QEMU's emulation on an x86-64 runner: an x86
# runner has no Arm virtualisation, and GitHub's Arm runners have no nested
# virtualisation at all (vmactions measured them slower still). A build that
# takes twenty minutes on amd64 takes several times that there, hence the
# per-entry timeout -- and hence pull requests build the three amd64 ones
# only. Every push to main, every dispatch and every release builds all six.
#
# WHAT IS DIFFERENT FROM A DESKTOP BUILD
#
# OpenBSD and NetBSD build with mods OFF. The Gearbox runtime is WAMR, which
# has a FreeBSD platform layer and none for either of the others, and
# OpenBSD's W^X policy is a poor fit for a WASM interpreter that wants
# writable-then-executable pages anyway. Rather than ship a build whose mod
# menu is there and does nothing, mods are compiled out and README.md says so.
# FreeBSD keeps them, on both architectures.
#
# The build, the headless run and the packaging are tools/bsd_game_build.sh,
# one script for all six; the VM steps below only install packages.
name: BSD game

on:
  push:
    branches: [main]
    tags-ignore: ["**"]        # a tag is release-game.yml's, which calls this
  pull_request:
  workflow_call:
    inputs:
      emulated:
        description: "Also build the arm64 entries (emulated, and slow)"
        type: boolean
        default: true
  workflow_dispatch:
    inputs:
      emulated:
        description: "Also build the arm64 entries (emulated, and slow)"
        type: boolean
        default: true

permissions:
  contents: read

# As test.yml: on a pull request the newest commit makes an older run moot;
# anywhere else every run finishes. github.workflow is the CALLER's name when
# this is called, so a release and a dry run never share a group.
concurrency:
  group: bsd-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The matrix, filtered. A matrix cannot `if:` one of its own entries away, so
  # the list is built here and the build job runs whatever this hands it.
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - uses: actions/checkout@v5
      # The names this workflow publishes, the updater's keys, the download
      # page and the server list, checked as one (see the script). Here
      # because this is the workflow that adds platforms most often, and it
      # runs on every pull request; it takes a second.
      - name: Release names agree
        run: python3 tools/check_release_names.py
      - id: m
        shell: python
        env:
          # Empty when not called with inputs (a push or a pull request).
          EMULATED: ${{ inputs.emulated }}
          EVENT: ${{ github.event_name }}
        run: |
          import json, os
          # odseal is the directory CMake asks for (CMakeLists.txt, "THE BSDs,
          # NAMED ONE WAY"): amd64 and aarch64 on every BSD.
          entries = [
            {"name": "freebsd-amd64", "bsd": "freebsd", "arch": "x86_64",  "machine": "x86_64",  "odseal": "freebsd-amd64",   "timeout": 120},
            {"name": "openbsd-amd64", "bsd": "openbsd", "arch": "x86_64",  "machine": "x86_64",  "odseal": "openbsd-amd64",   "timeout": 120},
            {"name": "netbsd-amd64",  "bsd": "netbsd",  "arch": "x86_64",  "machine": "x86_64",  "odseal": "netbsd-amd64",    "timeout": 120},
            {"name": "illumos-amd64", "bsd": "illumos", "arch": "x86_64",  "machine": "x86_64",  "odseal": "illumos-amd64",   "timeout": 150},
            {"name": "haiku-x64",     "bsd": "haiku",   "arch": "x86_64",  "machine": "x86_64",  "odseal": "haiku-x86_64",    "timeout": 150},
            {"name": "freebsd-arm64", "bsd": "freebsd", "arch": "aarch64", "machine": "aarch64", "odseal": "freebsd-aarch64", "timeout": 350},
            {"name": "openbsd-arm64", "bsd": "openbsd", "arch": "aarch64", "machine": "aarch64", "odseal": "openbsd-aarch64", "timeout": 350},
            {"name": "netbsd-arm64",  "bsd": "netbsd",  "arch": "aarch64", "machine": "aarch64", "odseal": "netbsd-aarch64",  "timeout": 350},
          ]
          # Pull requests build amd64 only; everything else all six unless
          # told otherwise.
          if os.environ["EVENT"] == "pull_request" or os.environ.get("EMULATED") == "false":
              entries = [e for e in entries if e["arch"] == "x86_64"]
          for e in entries:
              e["artifact"] = "OpenDoctrines-" + e["name"]
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write("matrix=" + json.dumps({"include": entries}) + "\n")

  build:
    name: ${{ matrix.name }}
    needs: plan
    # 24.04, not 22.04: 22.04's QEMU predates the CPU model vmactions' Arm
    # images ask for, and OpenBSD arm64 died at boot with "unable to find CPU
    # model 'neoverse-n1'".
    runs-on: ubuntu-24.04
    # A whole game in a VM on a shared runner. The desktop jobs take about
    # fifteen minutes on real hardware; amd64 has room to be several times
    # that before it is a hang rather than a build, and arm64 is emulated.
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v5

      # BEFORE booting anything. A platform with no sealed archive stops at
      # configure, which on an emulated guest is half an hour in; this says
      # the same thing in a second, and says what to do about it.
      - name: The odseal prebuilt for ${{ matrix.odseal }} is committed
        run: |
          lib="third_party/odseal/${{ matrix.odseal }}/libodseal.a"
          if [ ! -f "$lib" ]; then
            echo "::error title=No odseal for ${{ matrix.name }}::$lib is not committed. \
          Run the 'odseal prebuilts' workflow (Actions tab), which builds it in the \
          same VM this job uses, and merge the branch it pushes. See docs/odseal.md."
            exit 1
          fi
          ls -l "$lib"

      - name: Build and package (FreeBSD ${{ matrix.arch }})
        if: matrix.bsd == 'freebsd'
        uses: vmactions/freebsd-vm@v1
        with:
          release: '14.2'
          arch: ${{ matrix.arch }}
          usesh: true
          copyback: true
          prepare: |
            set -e
            # libglvnd, not just mesa-libs: mesa-libs ships the LIBRARY and
            # libglvnd ships GL/gl.h, so without it raylib's find_package
            # leaves OPENGL_INCLUDE_DIR as NOTFOUND and the generate step
            # fails with a path that does not explain itself. The server
            # target builds without any of this, which is why a local FreeBSD
            # configure was happy and this was not.
            pkg install -y cmake ninja pkgconf python3 git \
                           libglvnd mesa-libs xorgproto \
                           libX11 libXext libXrandr libXi libXcursor \
                           libXinerama libxkbcommon wayland
            # Fail HERE if a tool is missing. A prepare block that quietly
            # half-worked turned up later as "cmake: not found" in the build,
            # which points at the wrong step.
            for t in cmake ninja python3; do
              command -v $t >/dev/null || { echo "prepare failed: no $t"; exit 1; }
            done
          run: |
            OD_ACHIEVEMENT_KEYS="${{ vars.OD_ACHIEVEMENT_KEYS }}" \
              sh tools/bsd_game_build.sh ${{ matrix.artifact }} ${{ matrix.machine }}

      - name: Build and package (OpenBSD ${{ matrix.arch }})
        if: matrix.bsd == 'openbsd'
        uses: vmactions/openbsd-vm@v1
        with:
          # 7.7, not 7.6: OpenBSD keeps package sets for the two most recent
          # releases, and 7.6's were pruned --
          #
          #   https://cdn.openbsd.org/pub/OpenBSD/7.6/packages/amd64/: no such dir
          #
          # so pkg_add found nothing, the step carried on, and the build
          # failed later with "cmake: not found". The odseal job survives on
          # 7.6 because it needs only base clang and installs nothing.
          #
          # This pins a release that will itself age out. When it does, the
          # symptom is that same "no such dir" line in the prepare step.
          # Unifico's build.yml pins the same release; move them together.
          release: '7.7'
          arch: ${{ matrix.arch }}
          usesh: true
          copyback: true
          prepare: |
            set -e
            # NOT `pkg_add python3`. OpenBSD has no package by that name --
            # pkg_add answers "Can't find python3" and carries on, having
            # installed the others, so the prepare looked fine. The image
            # already ships a python3.NN under /usr/local/bin; what is missing
            # is only the unversioned name tools/package.py is invoked by.
            pkg_add -I cmake ninja git
            for t in cmake ninja; do
              command -v $t >/dev/null || { echo "prepare failed: no $t"; exit 1; }
            done
            if ! command -v python3 >/dev/null; then
              py=$(ls /usr/local/bin/python3.[0-9]* 2>/dev/null | grep -E 'python3\.[0-9]+$' | sort -V | tail -1)
              [ -n "$py" ] || { echo "prepare failed: no python3 anywhere"; exit 1; }
              ln -sf "$py" /usr/local/bin/python3
            fi
            python3 --version
          # OpenBSD ships X and Mesa in base (xenocara), so there is nothing
          # to install for them -- unlike FreeBSD, where they are ports.
          # OD_ENABLE_MODS=OFF: see the note at the top of this file.
          run: |
            OD_ACHIEVEMENT_KEYS="${{ vars.OD_ACHIEVEMENT_KEYS }}" \
              sh tools/bsd_game_build.sh ${{ matrix.artifact }} ${{ matrix.machine }} -DOD_ENABLE_MODS=OFF

      - name: Build and package (NetBSD ${{ matrix.arch }})
        if: matrix.bsd == 'netbsd'
        uses: vmactions/netbsd-vm@v1
        with:
          # NetBSD runs a binary built on an older release on a newer one, so
          # building on 10 reaches 10 and 11 both. Unifico's build.yml pins
          # the same release; move them together.
          release: '10.1'
          arch: ${{ matrix.arch }}
          copyback: true
          # pkgsrc, under /usr/pkg. Python is versioned there (python312
          # installs python3.12 and nothing called python3), so the
          # unversioned name is made here, as OpenBSD's is above. X and Mesa
          # are in base under /usr/X11R7 -- a prefix FindX11 searches and
          # FindOpenGL does not, hence the CMAKE_PREFIX_PATH below.
          prepare: |
            set -e
            export PATH="/usr/pkg/sbin:/usr/pkg/bin:$PATH"
            # -uu, upgrading dependencies too: the image is older than the
            # package set, and plain pkg_add refused git-base because it
            # needs a newer pcre2 than the one already installed.
            if command -v pkgin >/dev/null; then
              pkgin -y update && pkgin -y install cmake ninja-build git-base python312
            else
              /usr/sbin/pkg_add -I -uu cmake ninja-build git-base python312
            fi
            ln -sf /usr/pkg/bin/python3.12 /usr/pkg/bin/python3
            for t in cmake ninja git python3; do
              command -v $t >/dev/null || { echo "prepare failed: no $t"; exit 1; }
            done
            # The X11 sets (Mesa, its headers) are part of a normal install,
            # and the arm64 image has them -- the amd64 one does not. So add
            # them from the release's own sets when they are missing, rather
            # than depend on which image vmactions happened to build.
            if [ ! -f /usr/X11R7/include/GL/gl.h ]; then
              case "$(uname -m)" in
                amd64)   port=amd64 ;;
                evbarm)  port=evbarm-aarch64 ;;
                *)       echo "prepare failed: no X11 sets, and no port for $(uname -m)"; exit 1 ;;
              esac
              # The CDN keeps current releases only; once a newer point
              # release ships, the old one moves to archive.netbsd.org, and
              # the CDN answers 404 (10.1, once 10.2 was out). Try both.
              rel=$(uname -r)
              for set in xbase xcomp; do
                got=
                for base in https://cdn.netbsd.org/pub/NetBSD \
                            https://archive.netbsd.org/pub/NetBSD-archive; do
                  url="$base/NetBSD-$rel/$port/binary/sets/$set.tar.xz"
                  echo "fetching $url"
                  if ftp -o /tmp/$set.tar.xz "$url"; then got=1; break; fi
                done
                [ -n "$got" ] || { echo "prepare failed: no $set set for NetBSD $rel/$port"; exit 1; }
                tar -xpJf /tmp/$set.tar.xz -C /
                rm -f /tmp/$set.tar.xz
              done
            fi
            test -f /usr/X11R7/include/GL/gl.h || { echo "prepare failed: no X11/Mesa sets in this image"; exit 1; }
          # OD_ENABLE_MODS=OFF: see the note at the top of this file.
          run: |
            export PATH="/usr/pkg/sbin:/usr/pkg/bin:$PATH"
            OD_ACHIEVEMENT_KEYS="${{ vars.OD_ACHIEVEMENT_KEYS }}" \
              sh tools/bsd_game_build.sh ${{ matrix.artifact }} ${{ matrix.machine }} \
                -DOD_ENABLE_MODS=OFF -DCMAKE_PREFIX_PATH=/usr/X11R7

      # The same check the desktop jobs run, for the same reason: v1.0.4a
      # shipped with sign-in disabled on every platform and CI was green,
      # because the thing that was broken existed only in the build nobody
      # tested. LC_ALL=C because GNU grep in a UTF-8 locale can decline to
      # match inside a binary whose bytes are not valid UTF-8.
      # OPENINDIANA, for illumos. Not a BSD, but the same shape of job: a real
      # system booted by vmactions, the same build script, mods off (WAMR has
      # no illumos platform layer). x86-64 only -- no illumos distribution
      # ships for Arm, so there is no image to boot and nobody to run a build.
      #
      # The image is the TEXT install, so X11, Mesa and the compiler all come
      # from IPS here. Each package is installed on its own and a miss is
      # printed rather than fatal: `pkg install` refuses the whole list over
      # one unknown name, and the checks after it say what actually matters.
      # Exit 4 is "nothing to do", which is success.
      - name: Build and package (OpenIndiana ${{ matrix.arch }})
        if: matrix.bsd == 'illumos'
        uses: vmactions/openindiana-vm@v1
        with:
          release: '202604'
          copyback: true
          prepare: |
            for p in build-essential developer/build/cmake developer/build/ninja \
                     developer/versioning/git runtime/python-313 \
                     x11/library/mesa x11/library/libx11 x11/library/libxext \
                     x11/library/libxrandr x11/library/libxinerama x11/library/libxcursor \
                     x11/library/libxi x11/header/x11-protocols library/libxkbcommon; do
              pkg install -q "$p"; rc=$?
              [ $rc = 0 ] || [ $rc = 4 ] || echo "pkg: $p not installed (exit $rc)"
            done
            for t in cmake ninja gcc g++ python3; do
              command -v $t >/dev/null || { echo "prepare failed: no $t"; exit 1; }
            done
            ls /usr/include/GL/gl.h /usr/include/X11/Xlib.h || { echo "prepare failed: no GL/X11 headers"; exit 1; }
            gcc --version | head -1
          run: |
            OD_ACHIEVEMENT_KEYS="${{ vars.OD_ACHIEVEMENT_KEYS }}" CC=gcc CXX=g++ \
              sh tools/bsd_game_build.sh ${{ matrix.artifact }} ${{ matrix.machine }} -DOD_ENABLE_MODS=OFF
      # HAIKU. GLFW has no Haiku backend, so this is the SDL build (raylib on
      # SDL3, as Linux and Windows are) against the system's own libsdl3 --
      # see "EXCEPT ON HAIKU" in CMakeLists.txt for why not the pinned one.
      # Mods off: WAMR has no Haiku platform layer. x86-64 only: the 32-bit
      # build is the gcc2 hybrid, which cannot build C++20.
      #
      # Packages by what they provide (cmd:, devel:) rather than by package
      # name, so a renamed or re-versioned HaikuPorts package still resolves.
      - name: Build and package (Haiku ${{ matrix.arch }})
        if: matrix.bsd == 'haiku'
        uses: vmactions/haiku-vm@v1
        with:
          release: 'r1beta6'
          copyback: true
          prepare: |
            set -e
            pkgman install -y cmd:cmake cmd:ninja cmd:python3 cmd:git cmd:gcc cmd:zip \
                              devel:libSDL3 devel:libGL
            for t in cmake ninja python3 gcc g++; do
              command -v $t >/dev/null || { echo "prepare failed: no $t"; exit 1; }
            done
            gcc --version | head -1
          run: |
            OD_ACHIEVEMENT_KEYS="${{ vars.OD_ACHIEVEMENT_KEYS }}" \
              sh tools/bsd_game_build.sh ${{ matrix.artifact }} ${{ matrix.machine }} -DOD_ENABLE_MODS=OFF
      - name: The packaged copy carries the account service
        shell: bash
        run: |
          set -e
          issuer="https://opendoctrines-net.opendoctrines.workers.dev"
          found=$(LC_ALL=C grep -rla "$issuer" "dist/${{ matrix.artifact }}" 2>/dev/null | head -3 || true)
          if [ -z "$found" ]; then
            echo "::error title=No account service::${{ matrix.artifact }} does not carry $issuer."
            exit 1
          fi
          echo "account service found in:"
          echo "$found"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}.zip
          if-no-files-found: error
          retention-days: 14
