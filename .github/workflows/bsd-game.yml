# The game, built on FreeBSD and OpenBSD.
#
# WHY A SEPARATE WORKFLOW
#
# GitHub hosts no BSD runner and is not going to, so these build inside a real
# BSD VM (vmactions) on a Linux runner -- by the target system's own cc, not
# cross-compiled by a Linux toolchain pretending. That is a different shape
# from every other entry in release-game.yml's matrix, which is one job per
# runner, so it lives on its own and is CALLED from there.
#
# It is also workflow_dispatch, which the release path is not: a BSD build
# that can only be exercised by tagging is one that gets discovered broken on
# a tag, which is the exact failure release-dryrun.yml exists to prevent.
#
# WHAT IS DIFFERENT FROM A DESKTOP BUILD
#
# OpenBSD builds with mods OFF. The Gearbox runtime is WAMR, which has no
# OpenBSD port, and OpenBSD's W^X policy is a poor fit for a WASM interpreter
# that wants writable-then-executable pages. Rather than ship a build whose
# mod menu is there and does nothing, mods are compiled out and README.md says
# so. FreeBSD keeps them.
name: BSD game

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ubuntu-22.04
    # A whole game in an emulated VM on a shared runner. The desktop jobs take
    # about fifteen minutes on real hardware; this has room to be several
    # times that before it is a hang rather than a build.
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: freebsd-amd64, artifact: OpenDoctrines-freebsd-amd64 }
          - { name: openbsd-amd64, artifact: OpenDoctrines-openbsd-amd64 }

    steps:
      - uses: actions/checkout@v5

      - name: Build and package (FreeBSD amd64)
        if: matrix.name == 'freebsd-amd64'
        uses: vmactions/freebsd-vm@v1
        with:
          release: '14.2'
          usesh: true
          copyback: true
          prepare: |
            set -e
            # libglvnd, not just mesa-libs: mesa-libs ships the LIBRARY and
            # libglvnd ships GL/gl.h, so without it raylib's find_package
            # leaves OPENGL_INCLUDE_DIR as NOTFOUND and the generate step
            # fails with a path that does not explain itself. The server
            # target builds without any of this, which is why a local FreeBSD
            # configure was happy and this was not.
            pkg install -y cmake ninja pkgconf python3 git \
                           libglvnd mesa-libs xorgproto \
                           libX11 libXext libXrandr libXi libXcursor \
                           libXinerama libxkbcommon wayland
            # Fail HERE if a tool is missing. A prepare block that quietly
            # half-worked turned up later as "cmake: not found" in the build,
            # which points at the wrong step.
            for t in cmake ninja python3; do
              command -v $t >/dev/null || { echo "prepare failed: no $t"; exit 1; }
            done
          run: |
            set -e
            cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
              -DOD_ACCOUNT_ISSUER=https://opendoctrines-net.opendoctrines.workers.dev \
              -DOD_DISCORD_APP_ID=1547303703370014830
            cmake --build build --target OpenDoctrines -j 4

            # AND THE HEADLESS SERVER, so something can actually be RUN here.
            # The game itself needs an OpenGL window and there is no display
            # in a VM on a CI runner, so a build that is only ever compiled is
            # all a BSD job could otherwise claim. The server is the same
            # engine with raylib stubbed out: --check loads a shipped map,
            # builds a world and exits, which exercises the map reader, the
            # save layer, the AI tables and the text layer odseal feeds.
            cmake --build build --target OpenDoctrinesServer -j 4
            ./build/OpenDoctrinesServer --map 1939 --no-tunnel --check

            # Echoed either side, because this step once did not run at all
            # and nothing said so: the job went green here and failed in the
            # NEXT step with "does not carry the account service", which is a
            # report about a directory that was never created.
            echo "=== packaging ==="
            python3 tools/package.py --binary build/OpenDoctrines \
                                     --out dist/OpenDoctrines-freebsd-amd64 --zip
            echo "=== packaged ==="
            ls -lh dist/
            test -d dist/OpenDoctrines-freebsd-amd64 || { echo "no packaged tree"; exit 1; }

      - name: Build and package (OpenBSD amd64)
        if: matrix.name == 'openbsd-amd64'
        uses: vmactions/openbsd-vm@v1
        with:
          # 7.7, not 7.6: OpenBSD keeps package sets for the two most recent
          # releases, and 7.6's were pruned --
          #
          #   https://cdn.openbsd.org/pub/OpenBSD/7.6/packages/amd64/: no such dir
          #
          # so pkg_add found nothing, the step carried on, and the build
          # failed later with "cmake: not found". The odseal job survives on
          # 7.6 because it needs only base clang and installs nothing.
          #
          # This pins a release that will itself age out. When it does, the
          # symptom is that same "no such dir" line in the prepare step.
          release: '7.7'
          usesh: true
          copyback: true
          prepare: |
            set -e
            # NOT `pkg_add python3`. OpenBSD has no package by that name --
            # pkg_add answers "Can't find python3" and carries on, having
            # installed the others, so the prepare looked fine. The image
            # already ships a python3.NN under /usr/local/bin; what is missing
            # is only the unversioned name tools/package.py is invoked by.
            pkg_add -I cmake ninja git
            for t in cmake ninja; do
              command -v $t >/dev/null || { echo "prepare failed: no $t"; exit 1; }
            done
            if ! command -v python3 >/dev/null; then
              py=$(ls /usr/local/bin/python3.[0-9]* 2>/dev/null | grep -E 'python3\.[0-9]+$' | sort -V | tail -1)
              [ -n "$py" ] || { echo "prepare failed: no python3 anywhere"; exit 1; }
              ln -sf "$py" /usr/local/bin/python3
            fi
            python3 --version
          run: |
            set -e
            # OpenBSD ships X and Mesa in base (xenocara), so there is nothing
            # to install for them -- unlike FreeBSD, where they are ports.
            #
            # OD_ENABLE_MODS=OFF: see the note at the top of this file.
            cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
              -DOD_ENABLE_MODS=OFF \
              -DOD_ACCOUNT_ISSUER=https://opendoctrines-net.opendoctrines.workers.dev \
              -DOD_DISCORD_APP_ID=1547303703370014830
            cmake --build build --target OpenDoctrines -j 4

            # See the note in the FreeBSD block: this is the only thing in a
            # BSD job that RUNS rather than compiles.
            cmake --build build --target OpenDoctrinesServer -j 4
            ./build/OpenDoctrinesServer --map 1939 --no-tunnel --check

            # Echoed either side, because this step once did not run at all
            # and nothing said so: the job went green here and failed in the
            # NEXT step with "does not carry the account service", which is a
            # report about a directory that was never created.
            echo "=== packaging ==="
            python3 tools/package.py --binary build/OpenDoctrines \
                                     --out dist/OpenDoctrines-openbsd-amd64 --zip
            echo "=== packaged ==="
            ls -lh dist/
            test -d dist/OpenDoctrines-openbsd-amd64 || { echo "no packaged tree"; exit 1; }

      # The same check the desktop jobs run, for the same reason: v1.0.4a
      # shipped with sign-in disabled on every platform and CI was green,
      # because the thing that was broken existed only in the build nobody
      # tested. LC_ALL=C because GNU grep in a UTF-8 locale can decline to
      # match inside a binary whose bytes are not valid UTF-8.
      - name: The packaged copy carries the account service
        shell: bash
        run: |
          set -e
          issuer="https://opendoctrines-net.opendoctrines.workers.dev"
          found=$(LC_ALL=C grep -rla "$issuer" "dist/${{ matrix.artifact }}" 2>/dev/null | head -3 || true)
          if [ -z "$found" ]; then
            echo "::error title=No account service::${{ matrix.artifact }} does not carry $issuer."
            exit 1
          fi
          echo "account service found in:"
          echo "$found"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}.zip
          if-no-files-found: error
          retention-days: 14
