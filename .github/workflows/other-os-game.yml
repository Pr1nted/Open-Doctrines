# The game, built for the systems that are neither a desktop runner's own nor
# a BSD: OpenIndiana (illumos), Haiku and SerenityOS.
#
# WHY ITS OWN WORKFLOW
#
# GitHub hosts no runner for any of them, so each is built on its own system
# by its own compiler -- inside a real VM (vmactions) where one exists -- on a
# Linux runner. The BSDs work the same way but are three flavours of one
# family with an arm64 half; these three have nothing in common but that, and
# they are released, versioned and gated together: release-game.yml and
# release-dryrun.yml CALL this workflow beside bsd-game.yml, and a release
# waits for it before it can be confirmed.
#
# AND IT RUNS ON ITS OWN, on every pull request and every push to main, the
# same triggers as test.yml and bsd-game.yml, so a break on one of these
# systems is found before a tag rather than by one.
#
# WHAT EVERY ENTRY DOES
#
# Build the game and the headless server, check the binary is the
# architecture its name says, load 1939 in the server, package -- the same
# tools/bsd_game_build.sh the BSDs use -- then check the packaged copy
# carries the account service and upload it under its release name. Mods are
# off on all three: WAMR has a platform layer for none of them.

name: Other OS game

on:
  push:
    branches: [main]
    tags-ignore: ["**"]        # a tag is release-game.yml's, which calls this
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

# As bsd-game.yml: on a pull request the newest commit makes an older run
# moot; anywhere else every run finishes.
concurrency:
  group: other-os-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # x86-64 only: no illumos distribution ships for Arm.
          - { name: illumos-amd64, os: illumos, machine: x86_64, odseal: illumos-amd64, timeout: 150 }
    env:
      ARTIFACT: OpenDoctrines-${{ matrix.name }}
    steps:
      - uses: actions/checkout@v5

      - name: The odseal prebuilt for ${{ matrix.odseal }} is committed
        run: |
          lib="third_party/odseal/${{ matrix.odseal }}/libodseal.a"
          if [ ! -f "$lib" ]; then
            echo "::error title=No odseal for ${{ matrix.name }}::$lib is not committed. \
          Run the 'odseal prebuilts' workflow (Actions tab), which builds it in the \
          same system this job uses, and merge the branch it pushes. See docs/odseal.md."
            exit 1
          fi
          ls -l "$lib"

      # OPENINDIANA, for illumos. The image is the TEXT install, so X11, Mesa
      # and the compiler all come from IPS here. Each package is installed on
      # its own and a miss is printed rather than fatal: `pkg install` refuses
      # the whole list over one unknown name, and the checks after it say what
      # actually matters. Exit 4 is "nothing to do", which is success.
      - name: Build and package (OpenIndiana)
        if: matrix.os == 'illumos'
        uses: vmactions/openindiana-vm@v1
        with:
          release: '202604'
          copyback: true
          prepare: |
            for p in build-essential developer/build/cmake developer/build/ninja \
                     developer/versioning/git runtime/python-313 \
                     x11/library/mesa x11/library/libx11 x11/library/libxext \
                     x11/library/libxrandr x11/library/libxinerama x11/library/libxcursor \
                     x11/library/libxi x11/header/x11-protocols library/libxkbcommon; do
              pkg install -q "$p"; rc=$?
              [ $rc = 0 ] || [ $rc = 4 ] || echo "pkg: $p not installed (exit $rc)"
            done
            for t in cmake ninja gcc g++ python3; do
              command -v $t >/dev/null || { echo "prepare failed: no $t"; exit 1; }
            done
            ls /usr/include/GL/gl.h /usr/include/X11/Xlib.h || { echo "prepare failed: no GL/X11 headers"; exit 1; }
            gcc --version | head -1
          run: |
            OD_ACHIEVEMENT_KEYS="${{ vars.OD_ACHIEVEMENT_KEYS }}" CC=gcc CXX=g++ \
              sh tools/bsd_game_build.sh ${{ env.ARTIFACT }} ${{ matrix.machine }} -DOD_ENABLE_MODS=OFF

      # The same check bsd-game.yml makes, for the same reason: a build that
      # silently lost its account service configures, builds and packages
      # fine, and only fails in a player's hands.
      - name: The packaged copy carries the account service
        shell: bash
        run: |
          set -e
          issuer="https://opendoctrines-net.opendoctrines.workers.dev"
          found=$(LC_ALL=C grep -rla "$issuer" "dist/$ARTIFACT" 2>/dev/null | head -3 || true)
          if [ -z "$found" ]; then
            echo "::error title=No account service::$ARTIFACT does not carry $issuer."
            exit 1
          fi
          echo "account service found in:"
          echo "$found"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT }}
          path: dist/${{ env.ARTIFACT }}.zip
          if-no-files-found: error
          retention-days: 14
