# Game release. Triggered by the tag tools/release.py pushes (v1.0.3a).
#
# THE SHAPE
#
#   build (matrix) ─┐
#                   ├─>  confirm (manual gate)  ->  publish  ->  itch.io
#   test  (test.yml)┘
#
# TWO gates, and they catch different things. `test` is a machine asking "does
# this work on each platform" -- the mod system, four players hosting and
# joining, and a real game resolving turns. `confirm` is a human asking the
# question a machine cannot: is it any good. Nothing is published until both
# have passed, so neither a build that does not run nor a build that runs badly
# can reach anyone.
#
# `test` is deliberately not restated here; it lives in test.yml so that the
# release pipeline and the every-push pipeline cannot drift into checking
# different things.
#
# SECRETS
#
# BUTLER_API_KEY is a repository secret and is never in the repository. If it is
# absent the itch.io step warns and the release still succeeds -- a missing itch
# key is not a reason to withhold a GitHub release.

name: Release game

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release"
        required: true

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false     # one platform failing should not hide the others
      matrix:
        include:
          - name: macos-arm64
            os: macos-14
            artifact: OpenDoctrines-macos-arm64
          - name: macos-x64
            # macos-15-intel: the macos-13 image is retired, and a job asking
            # for it queues forever instead of failing. See test.yml.
            os: macos-15-intel
            artifact: OpenDoctrines-macos-x64
          - name: windows-x64
            os: windows-2022
            artifact: OpenDoctrines-windows-x64
          - name: linux-x64
            os: ubuntu-22.04
            artifact: OpenDoctrines-linux-x64

    steps:
      - uses: actions/checkout@v5

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # raylib's X11 backend. Without these CMake configures and then fails
          # at link with errors that do not mention X11 at all.
          sudo apt-get install -y libasound2-dev libx11-dev libxrandr-dev \
            libxi-dev libgl1-mesa-dev libglu1-mesa-dev libxcursor-dev \
            libxinerama-dev libwayland-dev libxkbcommon-dev

      - name: Configure
        # OD_ACCOUNT_ISSUER is what makes sign-in exist in a shipped copy.
        # Empty by default on purpose (a source build must not point at our
        # service), and there is nowhere else a release can carry it: config.json
        # is user data and never packaged. v1.0.4a shipped without it and every
        # player got "No account service is configured", pointing them at a file
        # they do not have.
        #
        # Written here rather than in a repository variable so it cannot be
        # silently unset -- an empty value reproduces exactly that bug, quietly.
        #
        # ONE LINE, and it has to stay one line. This step declares no shell, so
        # it runs in bash on Linux and macOS and in POWERSHELL on Windows, where
        # `\` is not a line continuation -- it is a path separator. Splitting
        # this across lines broke the Windows configure and nothing else, which
        # is the confusing way for it to fail: three platforms green, one red,
        # in a step that had not changed on any of them.
        #
        # GDTL is ON here and OFF in the web job below, deliberately. The
        # desktop flow has been driven through its own UI and its round trip is
        # covered by GdtlTest; the browser one has never been clicked through by
        # anybody, and the freeze it had was in exactly this kind of code.
        #
        # OD_DRAGOMAN_REF IS QUOTED, and has to be. This step runs in PowerShell
        # on Windows, which ate the unquoted value: the same command line that
        # gave CMake `v0.4.1` on Linux and macOS gave it `v0` on Windows, and
        # the clone then failed with "invalid reference: v0". Three platforms
        # green, one red, on an identical string -- the quotes are what make
        # the argument survive the shell.
        #
        # OD_DRAGOMAN_REF is PINNED. It defaults to `main`, which is right for
        # CI -- an upstream regression should surface here within a run -- and
        # wrong for a release, which would then only be reproducible against
        # whatever that branch was on the day. Bump this to the tag a release is
        # meant to carry; see the option's own comment in CMakeLists.txt.
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DOD_ACCOUNT_ISSUER=https://opendoctrines-net.opendoctrines.workers.dev -DOD_ENABLE_GDTL=ON "-DOD_DRAGOMAN_REF=v0.4.1"

      # The build gate. Every later job depends on this one, so a platform that
      # does not compile stops its own release without stopping the others.
      - name: Build
        run: cmake --build build --config Release --target OpenDoctrines -j 4

      # WHICH STAGE LOSES IT.
      #
      # The Linux artifact has no account-service URL in it while CMake reports
      # the right one, so the loss is between the flags and the binary. This
      # says where: the generated define, then the object Config.cpp compiles
      # to, then the executable the linker produces.
      - name: Where the account service went
        shell: bash
        run: |
          echo "--- generated define ---"
          grep -ho "OD_ACCOUNT_ISSUER=[^ ]*" build/CMakeFiles/OpenDoctrines.dir/flags.make | head -2 || echo "(not in flags.make)"
          obj=$(find build -name "Config.cpp.o" | head -1)
          echo "--- object: ${obj:-<none>} ---"
          if [ -n "$obj" ]; then
            echo "opendoctrines-net in object : $(LC_ALL=C grep -c "opendoctrines-net" "$obj" 2>/dev/null || echo 0)"
          fi
          bin=build/OpenDoctrines
          [ -f "build/Release/OpenDoctrines.exe" ] && bin=build/Release/OpenDoctrines.exe
          [ -d "build/OpenDoctrines.app" ] && bin=build/OpenDoctrines.app/Contents/MacOS/OpenDoctrines
          echo "--- linked binary: $bin ---"
          if [ -f "$bin" ]; then
            echo "opendoctrines-net in binary : $(LC_ALL=C grep -c "opendoctrines-net" "$bin" 2>/dev/null || echo 0)"
            # And after the strip packaging applies, which is the only thing
            # that touches the binary between here and the artifact.
            cp "$bin" /tmp/probe.bin
            if [ "$RUNNER_OS" = "macOS" ]; then strip -S -x /tmp/probe.bin || true
            else strip --strip-unneeded /tmp/probe.bin || true; fi
            echo "opendoctrines-net after strip: $(LC_ALL=C grep -c "opendoctrines-net" /tmp/probe.bin 2>/dev/null || echo 0)"
          fi

      - name: Package (clean)
        shell: bash
        run: |
          BIN=build/OpenDoctrines
          [ -d "build/OpenDoctrines.app" ] && BIN=build/OpenDoctrines.app
          [ -f "build/Release/OpenDoctrines.exe" ] && BIN=build/Release/OpenDoctrines.exe
          python3 tools/package.py --binary "$BIN" \
                                   --out "dist/${{ matrix.artifact }}" --zip

      # THE ARTIFACT ABOUT TO BE UPLOADED, not a build made to test with.
      #
      # The test job compiles its own copy WITHOUT -DOD_ACCOUNT_ISSUER, so the
      # binary players download is the one nothing runs. That is not a
      # hypothetical gap: v1.0.4a shipped with sign-in disabled on all four
      # platforms, and CI was green, because the thing that was broken existed
      # only in the build nobody tested.
      #
      # So this reads the packaged tree itself, at the last moment before it
      # leaves the machine. The URL is a plain string literal in the binary --
      # bakedAccountIssuer() returns it -- so its absence means the define did
      # not reach this build.
      - name: The packaged copy carries the account service
        shell: bash
        run: |
          set -e
          issuer="https://opendoctrines-net.opendoctrines.workers.dev"
          # LC_ALL=C, because GNU grep in a UTF-8 locale can decline to match
          # inside a binary whose bytes are not valid UTF-8 -- which an
          # executable's are not. macOS (BSD grep) found the string and Linux
          # did not, on binaries built from the same command line, and the
          # difference was the locale rather than the build.
          # LC_ALL=C, because GNU grep in a UTF-8 locale can decline to match
          # inside a binary whose bytes are not valid UTF-8.
          #
          # NOT through `strings`. That was tried, to be tidier, and it made
          # the check worse: it stopped finding the URL on macOS, where the
          # raw grep had been finding it correctly. The plain grep is the one
          # with evidence behind it.
          found=$(LC_ALL=C grep -rla "$issuer" "dist/${{ matrix.artifact }}" 2>/dev/null | head -3 || true)
          if [ -z "$found" ]; then
            # SAY WHAT WAS ACTUALLY THERE. "not found" alone sent an
            # investigation through the shell, the locale and the strip step
            # before anybody could tell whether the string was missing, partial,
            # or simply being looked for in the wrong place.
            echo "--- what the artifact does contain ---"
            ls -la "dist/${{ matrix.artifact }}" | head -20 || true
            exe=$(find "dist/${{ matrix.artifact }}" -maxdepth 3 -type f -name "OpenDoctrines*" | head -1)
            echo "binary: ${exe:-<none found>}"
            if [ -n "$exe" ]; then
              file "$exe" || true
              echo "hits for 'workers.dev'   : $(LC_ALL=C grep -c "workers.dev" "$exe" 2>/dev/null || echo 0)"
              echo "hits for 'opendoctrines' : $(LC_ALL=C grep -c "opendoctrines" "$exe" 2>/dev/null || echo 0)"
              echo "hits for 'accountIssuer' : $(LC_ALL=C grep -c "accountIssuer" "$exe" 2>/dev/null || echo 0)"
              echo "the strings that mention the host:"
              LC_ALL=C strings -a "$exe" 2>/dev/null | grep -i "workers.dev\|opendoctrines" | sort -u | head -8 || true
              echo "and with a shorter minimum run length:"
              LC_ALL=C strings -a -n 4 "$exe" 2>/dev/null | grep -i "opendoctrines" | sort -u | head -8 || true
            fi
            echo "--------------------------------------"
            echo "::error title=No account service in ${{ matrix.artifact }}::This \
            build does not contain $issuer, so sign-in would be missing for every \
            player who downloads it -- which is exactly what shipped in v1.0.4a. \
            Check the -DOD_ACCOUNT_ISSUER on the configure step."
            exit 1
          fi
          echo "account service found in:"
          echo "$found"

      # The same guard, for the same reason, on the other flag this configure
      # step carries. OD_ENABLE_GDTL is OFF by default and the whole layer
      # compiles to stubs without it -- so a release that loses the flag still
      # builds, still packages, still passes every test, and ships a game whose
      # Experimental toggle refuses to turn on. Nothing about that is visible
      # from the outside, which is what makes it worth a check rather than a
      # habit.
      #
      # THE SENTINEL IS CHOSEN, not obvious. "open-dragoman" is wrong: the map
      # info popup prints that as a label whether or not the layer is built, so
      # a stub build passes a grep for it -- tried, and it did. The library's
      # diagnostic sentences are library-owned but are prose, and a guard that
      # fails when upstream rewords a message is a guard nobody keeps. So this
      # looks for the sidecar directory's name, which is part of the on-disk
      # format: every converted map contains one, and renaming it upstream
      # would break round trips, so it cannot drift quietly.
      - name: The packaged copy carries the translation layer
        shell: bash
        run: |
          set -e
          found=$(LC_ALL=C grep -rla "dragoman_sidecar" "dist/${{ matrix.artifact }}" 2>/dev/null | head -3 || true)
          if [ -z "$found" ]; then
            echo "::error title=No translation layer in ${{ matrix.artifact }}::This \
            build has no open-dragoman in it, so Settings -> Experimental -> GDTL \
            would refuse to turn on for every player who downloads it. Check the \
            -DOD_ENABLE_GDTL=ON on the configure step."
            exit 1
          fi
          echo "translation layer found in:"
          echo "$found"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}.zip
          retention-days: 14

      # An installer as well as the zip, on the two platforms where the zip is
      # the worse experience: Windows gets a Start-menu entry and an uninstaller
      # instead of "extract this somewhere", and macOS gets the drag-to-
      # Applications window everybody already knows.
      #
      # BOTH are still unsigned. An installer does not quiet SmartScreen or
      # Gatekeeper -- only a code-signing certificate does -- so README.md's
      # first-launch instructions apply to these exactly as they do to the zip.
      #
      # Linux keeps the tarball alone on purpose: a .deb or .rpm would put the
      # game somewhere dpkg owns, and the updater must not write there. See
      # GameUpdates::managedInstall().
      - name: Installer
        if: runner.os == 'Windows' || runner.os == 'macOS'
        shell: bash
        run: |
          cpack --config build/CPackConfig.cmake -B dist/installer
          ls -lh dist/installer/*.exe dist/installer/*.dmg 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows' || runner.os == 'macOS'
        with:
          name: ${{ matrix.artifact }}-installer
          path: |
            dist/installer/*.exe
            dist/installer/*.dmg
          retention-days: 14
          if-no-files-found: error

  # The browser build is a platform too, and the only one a player can try
  # without downloading anything -- which on itch.io is the difference between a
  # page people click and a page people bounce off.
  #
  # Built here rather than reused from test.yml, because that job proves it
  # compiles and then throws the result away. This one keeps it.
  web:
    name: Build web
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: mymindstorm/setup-emsdk@v14
        with: { version: latest }

      # tools/subset_font.py needs it, and the configure step degrades to
      # shipping the whole 11 MB Unifont without it -- quietly enough, with only
      # a CMake warning, that it is worth installing here rather than finding
      # out from a page that is eleven megabytes heavier than it should be.
      - name: Install fonttools
        run: python3 -m pip install --user fonttools

      - name: Build
        run: |
          # Same reason as the desktop configure above.
          emcmake cmake -B build-web -DCMAKE_BUILD_TYPE=Release \
            -DOD_ACCOUNT_ISSUER=https://opendoctrines-net.opendoctrines.workers.dev
          emmake cmake --build build-web -j 4

      - name: Package
        run: |
          set -e
          # FLAT, with index.html at the root.
          #
          # Every desktop zip here wraps its payload in a single top-level
          # folder, which is right for something a player extracts and wrong for
          # this: itch.io serves the root of the upload straight into an iframe,
          # so a folder gives a directory listing instead of a game.
          out=dist/OpenDoctrines-web
          mkdir -p "$out"
          cp build-web/index.html \
             build-web/OpenDoctrines.js \
             build-web/OpenDoctrines.wasm \
             build-web/OpenDoctrines.data \
             build-web/icon.png "$out/"
          # Everything deliberately kept OUT of the preload -- the music, the six
          # scenario archives and the AI model -- which therefore has to sit
          # beside the page under the exact path the loader asks for. This is
          # most of the upload by size now, and an upload missing it is a game
          # that reaches its menu and then cannot start.
          cp -r build-web/data "$out/data"
          (cd "$out" && zip -qr ../OpenDoctrines-web.zip .)
          ls -lh dist/OpenDoctrines-web.zip

      - uses: actions/upload-artifact@v4
        with:
          name: OpenDoctrines-web
          path: dist/OpenDoctrines-web.zip
          retention-days: 14
          if-no-files-found: error

  # Does it WORK on each platform, not just compile there.
  #
  # WHY THIS EXISTS
  #
  # `build` above compiles four platforms and tests none of them. That gap is
  # not theoretical: it is where a chmod() outside its header guard, a
  # WebSocket backend that stopped compiling when its class became pimpl'd, a
  # link flag CMake silently de-duplicated, and a tunnel helper with no stub on
  # non-POSIX platforms all lived. Every one compiled its own translation unit
  # and died at link or at startup, so every one was invisible to a build gate.
  #
  # The checks themselves live in test.yml, which also runs on every push --
  # calling it rather than restating it is what stops the release pipeline and
  # the everyday one from drifting into checking different things.
  #
  # It GATES the release: `confirm` needs this, so a build whose four-player
  # check or mod conformance failed never reaches the human approval step. That
  # is the right way round -- asking someone to play-test a build a machine
  # already knows is broken wastes the one reviewer the project has. The human
  # gate is for judging what a machine cannot, not for catching what it can.
  test:
    name: Test
    uses: ./.github/workflows/test.yml

  # Arm Linux has no GitHub-hosted runner. Saying so out loud beats quietly
  # shipping three platforms when the release notes claim four.
  note-arm-linux:
    name: Note - Linux Arm not built
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "::warning title=Linux Arm not built::GitHub hosts no Arm Linux \
          runner. This release does not include a Linux Arm build. Add a \
          self-hosted Arm runner, or accept that Arm Linux users build from \
          source."

  confirm:
    name: Play and confirm
    # Both: the artifacts have to exist AND the platforms have to have passed.
    needs: [build, test, web]
    runs-on: ubuntu-latest
    # The gate. Configure this environment in repository Settings with yourself
    # as a required reviewer; the job then blocks here until you approve.
    environment:
      name: release-confirmation
    steps:
      - uses: actions/download-artifact@v4
        with: { path: artifacts }
      - name: What you are approving
        run: |
          echo "Download each artifact above, run it, and play far enough to be"
          echo "sure it works. Approving this job publishes to players."
          find artifacts \( -name '*.zip' -o -name '*.exe' -o -name '*.dmg' \
                            -o -name '*.apk' \) -exec ls -lh {} \;

  publish:
    name: Publish
    needs: confirm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with: { path: artifacts }

      - name: Extract release notes
        id: notes
        run: |
          # The top section of CHANGELOG.md is this release, by construction:
          # release.py prepends it.
          # THIS RELEASE'S OWN SECTION, not "the top one". The game and the SDK
          # share one CHANGELOG and release independently, so the top section is
          # whichever shipped last -- release the SDK, then the game, and "top"
          # is the SDK's. It has to select by KIND and stop at the next release
          # header of either kind.
          #
          # THE DELIMITER IS A RELEASE HEADER, not any h2. release.py writes
          # "## game 1.0.6a" and the notes below it use ## for their own
          # sections -- which is the house style, and what CHANGELOG.md has
          # always looked like. Splitting on /^## / therefore stopped at the
          # first section INSIDE the notes: the v1.0.5a release shipped its
          # opening paragraph and silently dropped every word after it.
          awk -v kind=game '/^## (game|sdk) [0-9]/{ if (p) exit; p = ($2 == kind) } p' CHANGELOG.md > notes.md
          echo "Release notes:"; cat notes.md

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          # Installers as well as zips. Globbing only *.zip would have built
          # the .exe and .dmg, uploaded them as CI artifacts that expire in a
          # fortnight, and attached neither to the release -- a failure that
          # looks like success right up until someone goes looking for them.
          #
          # The .apk is here because that is precisely what then happened to it.
          # The android job builds and verifies an APK and uploads it, publish
          # downloads it with everything else, and it was in no glob -- so the
          # release that ANNOUNCES Android would have shipped every platform
          # except Android, and passed every check while doing it.
          files: |
            artifacts/**/*.zip
            artifacts/**/*.exe
            artifacts/**/*.dmg
            artifacts/**/*.apk
          body_path: notes.md
          # A version with a state letter other than r is not a full release.
          prerelease: ${{ !endsWith(github.ref_name, 'r') }}

      - name: Push to itch.io
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
          ITCH_TARGET: ${{ vars.ITCH_TARGET }}   # e.g. pr1nted/open-doctrines
        run: |
          if [ -z "$BUTLER_API_KEY" ]; then
            echo "::warning title=itch.io skipped::BUTLER_API_KEY is not set, so \
            nothing was pushed to itch.io. The GitHub release above is complete \
            and this is not a failure."
            exit 0
          fi
          if [ -z "$ITCH_TARGET" ]; then
            echo "::warning title=itch.io skipped::ITCH_TARGET repository \
            variable is not set (expected user/game). Skipping."
            exit 0
          fi
          curl -sL -o butler.zip \
            https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default
          unzip -q butler.zip && chmod +x butler
          # A build installed through the itch app is updated BY the itch app,
          # so it must not also update itself -- two updaters writing the same
          # directory is how an install ends up half one version and half
          # another. The zip on the GitHub release carries no marker and keeps
          # self-updating, which is right for a copy the player unzipped
          # themselves; the copy pushed here gets one.
          #
          # package.py writes each file as <folder>/<path>, so the marker goes
          # at <folder>/MANAGED. See GameUpdates::managedInstall().
          printf '%s\n' \
            'This copy of OpenDoctrines is managed by the itch app, so the' \
            'in-game updater will not replace it. Update it through itch.' \
            > MANAGED
          for z in artifacts/**/*.zip; do
            name=$(basename "$z" .zip)
            channel=$(printf '%s' "$name" | sed 's/^OpenDoctrines-//')
            # Not the web upload. It is flat, so there is no <folder>/ to put
            # the marker in, and nothing to mark: a page in an iframe has no
            # installed copy and no updater to hold off.
            if [ "$channel" != "web" ]; then
              mkdir -p "itchmark/$name"
              cp MANAGED "itchmark/$name/MANAGED"
              (cd itchmark && zip -q "../$z" "$name/MANAGED")
            fi
            echo "pushing $z -> $ITCH_TARGET:$channel"
            ./butler push "$z" "$ITCH_TARGET:$channel" \
                     --userversion "${GITHUB_REF_NAME#v}"
          done

          # The APK, which that loop structurally cannot carry: it is one file
          # rather than a folder of them, so there is no <folder>/ to put the
          # MANAGED marker in -- and nothing to mark either, since an APK is
          # installed and updated by the platform and the in-game updater does
          # not touch it. itch detects an .apk as an Android build on its own.
          apk=$(find artifacts -name '*.apk' | head -1)
          if [ -n "$apk" ]; then
            echo "pushing $apk -> $ITCH_TARGET:android"
            ./butler push "$apk" "$ITCH_TARGET:android" \
                     --userversion "${GITHUB_REF_NAME#v}"
          else
            echo "::warning title=No APK::No .apk among the artifacts, so \
            nothing was pushed to the itch android channel."
          fi

  # Steam, which is the same idea as the itch.io push above and a different
  # shape in three ways worth knowing before reading the script.
  #
  # A SEPARATE JOB rather than another step of `publish`, because steamcmd
  # needs 32-bit apt packages installed on the runner and the GitHub release
  # must not wait on that, nor fail with it. `needs: publish` keeps the
  # ordering -- the release exists before anything reaches a storefront -- while
  # keeping the failure domains apart.
  #
  # IT UPLOADS, IT DOES NOT PROMOTE. The itch push is live the moment butler
  # returns. A Steam build goes to the app and sits there until a human sets it
  # live on a branch, unless STEAM_BRANCH says otherwise. See the setlive note
  # in packaging/steam/app_build.vdf.
  #
  # WINDOWS AND LINUX ONLY. There is no macOS depot and that is deliberate;
  # the reason is written where the depot would be.
  #
  # Absent credentials warn and exit 0, exactly as itch does. A storefront that
  # is not configured yet is not a reason to fail a release that has already
  # been built, tested, approved and published.
  steam:
    name: Push to Steam
    needs: publish
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with: { path: artifacts }

      - name: Is Steam configured?
        id: gate
        env:
          STEAM_APPID: ${{ vars.STEAM_APPID }}
          STEAM_USERNAME: ${{ vars.STEAM_USERNAME }}
          STEAM_CONFIG_VDF: ${{ secrets.STEAM_CONFIG_VDF }}
        run: |
          # One gate, checked before anything is installed or extracted, so the
          # common case -- no Steam account yet -- costs seconds and prints one
          # clear line instead of failing somewhere deeper.
          missing=""
          [ -n "$STEAM_APPID" ]      || missing="$missing STEAM_APPID(var)"
          [ -n "$STEAM_USERNAME" ]   || missing="$missing STEAM_USERNAME(var)"
          [ -n "$STEAM_CONFIG_VDF" ] || missing="$missing STEAM_CONFIG_VDF(secret)"
          if [ -n "$missing" ]; then
            echo "::warning title=Steam skipped::Not configured ($missing), so \
            nothing was pushed to Steam. The GitHub release and the itch.io \
            push above are complete and this is not a failure."
            echo "go=no" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Numeric, because the depot ids are derived from it with shell
          # arithmetic further down and a non-numeric appid fails there instead
          # -- two steps later, in a message about depots. Same check
          # check-steam.yml makes, for the same reason.
          if ! printf '%s' "$STEAM_APPID" | grep -qE '^[0-9]+$'; then
            echo "::error title=Bad STEAM_APPID::STEAM_APPID is \
            '$STEAM_APPID', which is not a number."
            exit 1
          fi
          echo "go=yes" >> "$GITHUB_OUTPUT"

      - name: Stage the depot content
        if: steps.gate.outputs.go == 'yes'
        run: |
          set -e
          mkdir -p steam/content steam/output

          # The same marker the itch push writes, for the same reason: Steam
          # owns this install and updates it, so the in-game updater must hold
          # off. Two updaters writing one directory is how a copy ends up half
          # one version and half another. See GameUpdates::managedInstall().
          printf '%s\n' \
            'This copy of OpenDoctrines is installed by Steam, so the in-game' \
            'updater will not replace it. Update it through Steam.' \
            > MANAGED

          # package.py wraps each zip's payload in ONE top-level folder, so the
          # depot root is that inner folder rather than the extraction
          # directory. Getting this wrong installs the game one level down,
          # where the launch option configured in Steamworks finds nothing --
          # and it fails that way silently, because the upload itself succeeds.
          stage() {
            artifact="OpenDoctrines-$1"
            zip="artifacts/$artifact/$artifact.zip"
            if [ ! -f "$zip" ]; then
              echo "::error title=Missing artifact::$zip is not among the \
              downloaded artifacts, so the $2 depot would ship empty."
              exit 1
            fi
            unzip -q "$zip" -d "steam/content/$2"
            inner="steam/content/$2/$artifact"
            if [ ! -d "$inner" ]; then
              echo "::error title=Unexpected zip layout::$zip did not contain \
              a top-level $artifact/ folder. package.py's layout changed and \
              app_build.vdf's contentroot no longer matches it."
              exit 1
            fi
            cp MANAGED "$inner/MANAGED"
            echo "$2 depot root: $inner"
            ls "$inner"
          }
          stage windows-x64 windows
          stage linux-x64   linux

      - name: Write the build script
        if: steps.gate.outputs.go == 'yes'
        env:
          STEAM_APPID: ${{ vars.STEAM_APPID }}
          # Default to appid+1 and appid+2, which is what Steamworks hands out
          # for the first depots of a new app. Override the variables if your
          # app's depots were created in another order -- an id that is not
          # yours belongs to somebody else's app and the push simply fails.
          STEAM_DEPOT_WINDOWS: ${{ vars.STEAM_DEPOT_WINDOWS }}
          STEAM_DEPOT_LINUX: ${{ vars.STEAM_DEPOT_LINUX }}
          # Empty means "upload but promote nothing". See app_build.vdf.
          STEAM_BRANCH: ${{ vars.STEAM_BRANCH }}
        run: |
          set -e
          dwin=${STEAM_DEPOT_WINDOWS:-$((STEAM_APPID + 1))}
          dlin=${STEAM_DEPOT_LINUX:-$((STEAM_APPID + 2))}

          # steamcmd resolves buildoutput and contentroot against the SCRIPT's
          # own directory, so the substituted copy is written into the staging
          # root rather than left in packaging/.
          #
          # `|` as the sed delimiter because every substituted value here is an
          # absolute path.
          sed -e "s|__APPID__|$STEAM_APPID|g" \
              -e "s|__BUILDDESC__|${GITHUB_REF_NAME} (${GITHUB_SHA:0:7})|g" \
              -e "s|__BRANCH__|${STEAM_BRANCH}|g" \
              -e "s|__DEPOT_WINDOWS__|$dwin|g" \
              -e "s|__DEPOT_LINUX__|$dlin|g" \
              -e "s|__CONTENT_WINDOWS__|$PWD/steam/content/windows/OpenDoctrines-windows-x64|g" \
              -e "s|__CONTENT_LINUX__|$PWD/steam/content/linux/OpenDoctrines-linux-x64|g" \
              packaging/steam/app_build.vdf > steam/app_build.vdf

          # No placeholder left in it, or steamcmd reads a literal token as an
          # app number and reports something unrelated.
          #
          # COMMENT LINES ARE EXCLUDED, and that is not tidiness. The template's
          # own opening line explains that the workflow substitutes every
          # placeholder -- and to say so it has to contain one. A plain search
          # for the token shape matches that sentence and fails every release,
          # in a step whose whole purpose is catching a mistake nobody made.
          leftover=$(grep -vE '^[[:space:]]*//' steam/app_build.vdf \
                     | grep -E '__[A-Z_]+__' || true)
          if [ -n "$leftover" ]; then
            echo "::error title=Unsubstituted token::steam/app_build.vdf still \
            contains a placeholder. One was added to the template without a \
            matching sed rule here."
            printf '%s\n' "$leftover"
            exit 1
          fi
          echo "appid $STEAM_APPID, depots $dwin (windows) $dlin (linux)"
          echo "branch: ${STEAM_BRANCH:-<none, promote by hand in Steamworks>}"

      - name: Install steamcmd
        if: steps.gate.outputs.go == 'yes'
        run: |
          # Kept identical to check-steam.yml on purpose; if one needs a fix
          # the other needs the same one.
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y lib32gcc-s1
          mkdir -p steamcmd && cd steamcmd
          curl -sqL https://steamcdn-a.akamaihd.net/client/installer/steamcmd_linux.tar.gz \
            | tar zxf -
          ./steamcmd.sh +quit || true

      - name: Upload
        if: steps.gate.outputs.go == 'yes'
        env:
          STEAM_USERNAME: ${{ vars.STEAM_USERNAME }}
          STEAM_CONFIG_VDF: ${{ secrets.STEAM_CONFIG_VDF }}
          # Through env rather than interpolated into the script body, as
          # everywhere else here: an expression pasted straight into shell is
          # a habit that is harmless for a repository variable and is not
          # harmless the first time the value comes from somewhere else.
          STEAM_BRANCH: ${{ vars.STEAM_BRANCH }}
        run: |
          set -e
          mkdir -p ~/Steam/config
          printf '%s' "$STEAM_CONFIG_VDF" | base64 -d > ~/Steam/config/config.vdf

          # run_app_build needs an ABSOLUTE path. Given a relative one it
          # resolves against steamcmd's own directory, not the working
          # directory, and reports a missing file that is plainly there.
          #
          # `< /dev/null` so an expired session fails now instead of waiting
          # for a Steam Guard code nobody is there to type.
          cd steamcmd
          ./steamcmd.sh +login "$STEAM_USERNAME" \
                        +run_app_build "$GITHUB_WORKSPACE/steam/app_build.vdf" \
                        +quit < /dev/null | tee build.log || true

          # THE LOG IS THE RESULT, not the exit code. steamcmd exits 0 on
          # several kinds of failure, including a rejected login, so trusting
          # $? would report a successful release that uploaded nothing.
          if grep -qi "Successfully finished" build.log; then
            echo "Uploaded to Steam."
            if [ -z "$STEAM_BRANCH" ]; then
              echo "::notice title=Set it live::The build is uploaded but on \
              no branch. Promote it in Steamworks > Builds when you are ready."
            fi
          else
            echo "::error title=Steam upload failed::steamcmd did not report a \
            finished build. The log is above; a login failure and a depot \
            misconfiguration look different in it."
            exit 1
          fi
