# Does the itch.io credential actually work?
#
# The release pipeline pushes to itch as its very last step, which is the worst
# place to discover a bad key: the build is done, the GitHub release is already
# public, and the only symptom is a warning in a log nobody is reading. Worse,
# the push step is deliberately forgiving -- a missing key warns and exits 0,
# because a missing itch key is not a reason to withhold a GitHub release -- so
# a key that is absent and a key that is wrong look identical from the outside.
#
# This asks the question on its own, in a few seconds, before any of that.
#
# It is READ-ONLY. `butler status` names the channels and their most recent
# builds; it uploads nothing and changes nothing, so running it can never
# publish by accident.
name: Check itch.io credentials

on:
  workflow_dispatch:

jobs:
  check:
    name: butler status
    runs-on: ubuntu-latest
    steps:
      - name: Ask itch.io who we are
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
          ITCH_TARGET: ${{ vars.ITCH_TARGET }}
        run: |
          # Told apart on purpose. "Not set" and "set but rejected" need
          # different fixes, and a single "itch failed" would hide which.
          if [ -z "$BUTLER_API_KEY" ]; then
            echo "BUTLER_API_KEY is not set on this repository."
            echo "Add it with: gh secret set BUTLER_API_KEY"
            exit 1
          fi
          if [ -z "$ITCH_TARGET" ]; then
            echo "ITCH_TARGET is not set (expected user/game)."
            exit 1
          fi
          echo "Target: $ITCH_TARGET"

          # Does the key authenticate at all? Ask itch directly, because
          # `butler status` alone cannot answer it: it prints "No channel
          # found" both for a game that exists and has never had a build, and
          # for a target that is not there. Those need opposite fixes.
          #
          # Never echo the key. GitHub masks secret VALUES in logs, but that
          # masking is a safety net, not a licence to print them.
          me=$(curl -s -H "Authorization: $BUTLER_API_KEY" \
                 https://itch.io/api/1/key/me)
          if ! printf '%s' "$me" | jq -e .user.username > /dev/null 2>&1; then
            echo "The key was REJECTED by itch.io."
            echo "Response: $(printf '%s' "$me" | jq -r '.errors // "unparseable"')"
            exit 1
          fi
          echo "Key accepted. Account: $(printf '%s' "$me" | jq -r .user.username)"

          # Does the game itself exist? butler pushes builds to a game; it does
          # not create one. A release approved against a target that is not
          # there fails at the very last step, after publishing to GitHub.
          game=${ITCH_TARGET#*/}
          if curl -s -H "Authorization: $BUTLER_API_KEY" \
               https://itch.io/api/1/key/my-games \
             | jq -e --arg g "$game" \
                 '.games[] | select(.url | endswith("/" + $g))' > /dev/null; then
            echo "Game page exists: $ITCH_TARGET"
          else
            # A WARNING, not a failure, because this lookup is not authoritative
            # and has already cried wolf: it reported NO GAME for a target butler
            # had pushed five channels to minutes earlier. my-games matches on
            # the URL slug, which a project rename breaks, and it does not list
            # every project state. butler is the real test -- it cannot push to
            # a game that does not exist.
            echo "::warning title=itch game not listed::my-games did not list \
            $ITCH_TARGET. That may just mean the project was renamed or is not \
            listed by this endpoint; if the push below works, the game exists."
            echo "Projects this key can see:"
            curl -s -H "Authorization: $BUTLER_API_KEY" \
              https://itch.io/api/1/key/my-games | jq -r '.games[]?.url // empty'
          fi

          curl -sL -o butler.zip \
            https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default
          unzip -q butler.zip && chmod +x butler
          ./butler status "$ITCH_TARGET"
