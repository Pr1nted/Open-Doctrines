# The Plan 9 edition: the FreeRTOS edition's core, built by 9front's own
# compilers inside 9front, and made to play the same game.
#
# Separate from freertos.yml because it needs a different machine -- an
# amd64 PC running 9front, under QEMU -- and has no reason to wait on the
# boards, or they on it.
#
# What it proves:
#   host   (tests/plan9_test.sh) the shared core is in the C 9front's
#          compilers take, and prints play.expected through plan9/od9fmt.c,
#          the printf the Plan 9 build uses.
#   9front (tests/plan9_test.sh --9front) 9front boots headless in QEMU with
#          its console on the serial line (tools/plan9_9front.py); the source
#          goes in on a FAT disk; mk builds it with 6c and 6l; the console
#          program plays tests/freertos/play.txt; and the transcript is held
#          byte for byte to tests/freertos/play.expected -- the same file the
#          host, the POSIX port and every QEMU board are held to.
# What it does not prove: odmap's drawing. It is built, not looked at.
#
# The 9front ISO is pinned by URL and SHA-256 below: 9front-11952, the hash
# taken by this workflow's trust-on-first-use run. Emptied, a development run
# takes the newest ISO on 9front.org again and prints the two values to pin;
# releases refuse to run unpinned.
#
# A tag plan9-v* publishes the zip as a release of its own, as freertos-v*
# and templeos-v* do: a separate build with a separate promise.

name: Plan 9 edition

on:
  push:
    branches: [main]
    tags: ["plan9-v*"]
    paths:
      - "plan9/**"
      - "freertos/core/**"
      - "templeos/world.odw"
      - "templeos/Sync.HH"
      - "tools/freertos_world.py"
      - "tools/freertos_play.py"
      - "tools/plan9_*"
      - "tests/plan9*"
      - "tests/freertos/**"
      - ".github/workflows/plan9.yml"
  pull_request:
    paths:
      - "plan9/**"
      - "freertos/core/**"
      - "templeos/world.odw"
      - "templeos/Sync.HH"
      - "tools/freertos_world.py"
      - "tools/freertos_play.py"
      - "tools/plan9_*"
      - "tests/plan9*"
      - "tests/freertos/**"
      - ".github/workflows/plan9.yml"
  workflow_dispatch:

concurrency:
  group: plan9-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  # e.g. https://9front.org/iso/9front-NNNNN.amd64.iso.gz and its sha256sum.
  NINEFRONT_ISO_URL: "https://9front.org/iso/9front-11952.amd64.iso.gz"
  NINEFRONT_ISO_SHA256: "59ba79f1304f02c1aae573b337fa2569fc78027ce8e4c2056c4117e971025b91"

jobs:
  guest:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            qemu-system-x86 qemu-utils dosfstools mtools libarchive-tools \
            p7zip-full genisoimage file

      - name: The host checks
        run: tests/plan9_test.sh

      - name: Is a 9front ISO pinned?
        id: pin
        run: |
          if [ -n "$NINEFRONT_ISO_URL" ] && [ -n "$NINEFRONT_ISO_SHA256" ]; then
            echo "pinned=1" >> "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_REF" == refs/tags/plan9-v* ]]; then
            echo "::error::A plan9-v* release needs a pinned 9front ISO: trust on first use is for development runs, not releases."
            exit 1
          else
            # TRUST ON FIRST USE, as tools/dos_toolchain.sh does for CWSDPMI.
            # Nothing pinned yet: take the newest amd64 ISO 9front.org lists,
            # print its URL and SHA-256 for plan9.yml, and run with it. Once
            # the two env values above are filled in, this branch is dead.
            url=$(curl -fsSL --retry 3 https://9front.org/iso/ \
                  | grep -oE '9front-[0-9]+\.amd64\.iso(\.gz)?' | sort -t- -k2 -n | tail -1)
            if [ -z "$url" ]; then
              echo "::warning::No 9front ISO pinned, and none found on https://9front.org/iso/: the guest build and game did not run."
              echo "pinned=0" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "NINEFRONT_ISO_URL=https://9front.org/iso/$url" >> "$GITHUB_ENV"
            echo "pinned=tofu" >> "$GITHUB_OUTPUT"
          fi

      - name: KVM, when the runner has it
        if: steps.pin.outputs.pinned != '0'
        run: |
          if [ -e /dev/kvm ]; then
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
              | sudo tee /etc/udev/rules.d/99-kvm4all.rules
            sudo udevadm control --reload-rules
            sudo udevadm trigger --name-match=kvm
          fi

      - uses: actions/cache@v4
        if: steps.pin.outputs.pinned != '0'
        with:
          path: build/9front-iso
          key: 9front-iso-${{ env.NINEFRONT_ISO_SHA256 || env.NINEFRONT_ISO_URL }}

      - name: The 9front ISO, checked against its pin
        if: steps.pin.outputs.pinned != '0'
        run: |
          mkdir -p build/9front-iso
          f="build/9front-iso/$(basename "$NINEFRONT_ISO_URL")"
          [ -f "$f" ] || curl -fsSL --retry 3 -o "$f" "$NINEFRONT_ISO_URL"
          if [ -n "$NINEFRONT_ISO_SHA256" ]; then
            echo "$NINEFRONT_ISO_SHA256  $f" | sha256sum -c -
          else
            h=$(sha256sum "$f" | cut -d' ' -f1)
            echo "::notice title=Pin this 9front ISO in plan9.yml::NINEFRONT_ISO_URL: \"$NINEFRONT_ISO_URL\"  NINEFRONT_ISO_SHA256: \"$h\""
          fi
          echo "ISO=$f" >> "$GITHUB_ENV"

      - name: Built and played inside 9front
        if: steps.pin.outputs.pinned != '0'
        run: |
          if ! tests/plan9_test.sh --9front "$ISO"; then
            echo "::group::Diagnostics"
            ls -la build/plan9/guest || true
            file build/plan9/guest/*.iso build/plan9/guest/iso/*/* 2>/dev/null || true
            for l in build/plan9/guest/serial.log*; do
              echo "== $l (last 80 lines, escapes removed)"
              sed 's/\x1b\[[0-9;?]*[A-Za-z]//g' "$l" | tr -d '\r' | tail -80
            done
            cat build/plan9/9front.diff 2>/dev/null | head -60 || true
            echo "::endgroup::"
            exit 1
          fi
          # the binaries 6l linked in the guest, for the zip
          mkdir -p build/plan9/bin
          for b in 6.opendoctrines 6.odmap; do
            mcopy -n -o -i build/plan9/guest/src.img "::/plan9/$b" "build/plan9/bin/$b" || true
          done

      - name: Package
        run: |
          python3 tools/plan9_package.py --tree build/plan9/zip \
            --out dist/OpenDoctrines-plan9.zip --bin build/plan9/bin
          python3 tools/plan9_package.py --check dist/OpenDoctrines-plan9.zip

      - uses: actions/upload-artifact@v4
        with:
          name: OpenDoctrines-plan9
          path: dist/OpenDoctrines-plan9.zip

      - name: Transcripts and the guest's console, when they differ
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: plan9-transcripts
          path: |
            build/plan9/*.txt
            build/plan9/*.diff
            build/plan9/*.log
            build/plan9/guest/serial.log*
            build/plan9/guest/transcript.raw

  release:
    if: startsWith(github.ref, 'refs/tags/plan9-v')
    needs: guest
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: OpenDoctrines-plan9
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/OpenDoctrines-plan9.zip
          prerelease: true
