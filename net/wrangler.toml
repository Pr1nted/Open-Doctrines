name = "opendoctrines-net"
main = "src/index.ts"
compatibility_date = "2026-07-01"

# No preview URLs. They would expose the same auth endpoints on a second,
# unversioned host that no OAuth provider has been told about.
preview_urls = false

# Observability is deliberately OFF.
#
# This is not a cost decision, it is the retention promise in PRIVACY.md. With
# it on, Cloudflare retains request logs that would include the client IP of
# every player who logs in or joins a game, and "we keep no join history" would
# stop being true. If you turn this on you must also amend the policy.
[observability]
enabled = false

# PRIVACY.md is served verbatim at /privacy. Importing it as a module rather
# than pasting it into a .ts file means the published policy and the file in
# the repository cannot drift apart.
[[rules]]
type = "Text"
globs = ["**/*.md"]
fallthrough = true

[vars]
# The `iss` claim we stamp into tokens, and the value a game server checks to
# decide whether an identity is "official" (see Part F of the design: a badge
# from any other issuer renders as unofficial).
ISSUER = "https://opendoctrines-net.opendoctrines.workers.dev"

# ---------------------------------------------------------------- storage ----
#
# One namespace. Everything is keyed by prefix (acct:, ident:, nick:, dc:,
# tomb:, cfg:) rather than split across namespaces, because the free plan's
# limits are per-account, not per-namespace, so splitting would buy nothing and
# cost an extra binding.
[[kv_namespaces]]
binding = "OD_ACCOUNTS"
id = "91b9e4bfc8e24b26ab29d463c8e6c07f"

# ------------------------------------------------------------------ relay ----
[[durable_objects.bindings]]
name = "LOBBY"
class_name = "LobbyDO"

# SQLite-backed, and that is a requirement rather than a preference: Durable
# Objects are only available on the free plan with the SQLite storage backend.
# A `new_classes` migration here would work on a paid account and fail on a
# free one, which is exactly the wrong way round for this project.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["LobbyDO"]

# ------------------------------------------------------------ rate limit ----
#
# Free, and costs neither a KV operation nor a DO request -- the counter lives
# in memory at the edge. That matters here: a limiter implemented on top of KV
# would spend the very budget it exists to protect.
#
# It is BEST EFFORT AND PER-COLO, not a global ledger. A distributed flood is
# not what this stops; a single source hammering an unauthenticated endpoint is.
# The complement is a WAF rate-limiting rule in the dashboard, which cannot be
# expressed in this file -- see README.md, "Abuse and rate limits".
#
# Both windows are ten seconds rather than a minute, because the failure being
# guarded against is a burst. The limits are set against the chattiest thing a
# legitimate client does, which is /auth/poll at one request every two seconds.

# Two buckets rather than one so the paths are accounted SEPARATELY: someone
# flooding the relay must not be able to lock the same address out of logging
# in. The limits are the same number, and that is not an oversight -- see below.

[[ratelimits]]
name = "RATE_LIMIT_SESSION"
namespace_id = "1001"
# The relay path, and the only one that can instantiate a Durable Object.
#
# Not tighter than the API bucket, deliberately. What made an unknown code
# expensive was reaching the binding at all, and `isSessionCode` in
# lobby/session.ts now refuses those for free -- so this is defence in depth
# against flooding a code the attacker actually has, not the thing standing
# between us and the DO budget.
#
# Sized against the worst legitimate burst instead: a household or LAN behind
# one NAT is ONE address here, and a host dropping sends every player into a
# reconnect at once, each costing an /info and a socket. Eight players
# retrying together is ~16 requests in a couple of seconds, and a limit that
# turns a bad wifi moment into a lockout would be worse than the flood.
simple = { limit = 40, period = 10 }

[[ratelimits]]
name = "RATE_LIMIT_API"
namespace_id = "1002"
# Everything else. Eight times the poll rate, so a login that is retrying hard
# never sees a 429.
simple = { limit = 40, period = 10 }

# ---------------------------------------------------------------- secrets ----
#
# None of these live in this file. Set each with `wrangler secret put <NAME>`;
# see README.md for how to generate them.
#
#   ED25519_PRIVATE_KEY  JWK of the signing key for session tokens and tickets
#   ED25519_PUBLIC_JWK   the matching public JWK, served at /.well-known/od-keys.json
#   IDENT_KEY            HMAC key that hashes provider user ids before storage
#   PAIRWISE_KEY         HMAC key behind the per-server pseudonym (psid)
#   ADMIN_SECRET         gates badge grants
#   GOOGLE_CLIENT_ID     GOOGLE_CLIENT_SECRET
#   DISCORD_CLIENT_ID    DISCORD_CLIENT_SECRET
#   GITHUB_CLIENT_ID     GITHUB_CLIENT_SECRET
